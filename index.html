<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>ごきげん姫の自分軸</title>
  <meta name="description" content="ごきげん姫の自分軸 — 自分の機嫌を自分でとる、お姫様気分の自己ケアダイアリー" />
  <!-- iOS ホーム画面アイコン & アプリ名設定 -->
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="ごきげん姫の自分軸" />
  <meta name="theme-color" content="#fce7f3" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="stylesheet" href="./tw-output.css" />
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
  <style>
    html, body, #root { height: 100%; }
    body {
      font-family: "Zen Maru Gothic","Hiragino Maru Gothic ProN","M PLUS Rounded 1c",system-ui,sans-serif;
      background: linear-gradient(180deg,#fdf2f8 0%,#fdf4fb 50%,#f5f0fb 100%);
      -webkit-font-smoothing: antialiased;
      /* iOSのアドレスバー出入りによる「上下に揺れる」現象を防ぐ */
      overscroll-behavior-y: none;
    }
    /* iOS Safari の 100vh 問題対策：min-h-screen を動的ビューポート高さに */
    .min-h-screen { min-height: 100dvh !important; }
    /* 揺れ・回転・点滅の元になる無限アニメーション全停止（最終手段） */
    *, *::before, *::after {
      animation-iteration-count: 1 !important;
      animation-fill-mode: forwards !important;
    }
    .anim-float, .anim-float-emoji, .anim-wand-wave,
    .anim-spin, .anim-spin-r, .animate-pulse, .animate-bounce,
    .animate-spin, .animate-ping {
      animation: none !important;
    }
    /* iOS Safari でスクロール時のチカチカ・揺れの原因になる backdrop-filter を停止 */
    [class*="backdrop-blur"], [style*="backdropFilter"], [style*="backdrop-filter"] {
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    @keyframes floatY {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(0); }
    }
    @keyframes floatEmoji {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(0); }
    }
    @keyframes spin360 {
      from { transform: rotate(0deg); }
      to { transform: rotate(0deg); }
    }
    @keyframes spin360r {
      from { transform: rotate(0deg); }
      to { transform: rotate(0deg); }
    }
    .anim-fade { animation: fadeIn .5s ease; }
    .anim-slide { animation: slideUp .4s cubic-bezier(.16,1,.3,1); }
    .anim-float { animation: none; }
    .anim-float-emoji { animation: none; }
    .anim-spin { animation: none; }
    @keyframes heartFly {
      0%   { opacity: 1; transform: translate(-50%, -50%) scale(0.5); }
      30%  { opacity: 1; transform: translate(-50%, -100%) scale(1.2) rotate(-12deg); }
      70%  { opacity: 0.9; transform: translate(-50%, -180%) scale(1.0) rotate(8deg); }
      100% { opacity: 0; transform: translate(-50%, -260%) scale(0.7) rotate(-5deg); color: #f9a8d4; }
    }
    .anim-heart-fly { animation: heartFly 1.4s ease-out forwards; color: #ec4899; text-shadow: 0 0 8px rgba(244,114,182,0.5); }
    @keyframes sparkleFly {
      0%   { opacity: 1; transform: translate(-50%, -50%) scale(0.3) rotate(0deg); }
      30%  { opacity: 1; transform: translate(-50%, -100%) scale(1.4) rotate(60deg); }
      70%  { opacity: 0.9; transform: translate(-50%, -200%) scale(1.1) rotate(180deg); }
      100% { opacity: 0; transform: translate(-50%, -320%) scale(0.7) rotate(360deg); }
    }
    .anim-sparkle-fly { animation: sparkleFly 1.6s ease-out forwards; text-shadow: 0 0 12px rgba(255,200,230,0.9); }
    @keyframes wandWave {
      0%,100% { transform: rotate(0deg); }
      50%    { transform: rotate(0deg); }
    }
    .anim-wand-wave { animation: none; transform-origin: bottom center; }
    .anim-spin-r { animation: none; }
    input, textarea { font-family: inherit; }
    /* 選択時のハイライト色 */
    ::selection { background: #fbcfe8; }

    /* 全タブで継続アニメーション（ふわふわ・揺れ・回転）を完全停止 */
    .anim-float,
    .anim-float-emoji,
    .anim-wand-wave,
    .anim-spin,
    .anim-spin-r {
      animation: none !important;
      animation-play-state: paused !important;
    }
    /* keyframes 自体も動かないように上書き（保険） */
    @keyframes floatY      { 0%,100% { transform: translateY(0); } 50% { transform: translateY(0); } }
    @keyframes floatEmoji  { 0%,100% { transform: translateY(0); } 50% { transform: translateY(0); } }
    @keyframes spin360     { 0%,100% { transform: rotate(0deg); } }
    @keyframes spin360r    { 0%,100% { transform: rotate(0deg); } }
    @keyframes wandWave    { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(0deg); } }

    /* 魔法のステッキの姫イラスト ── 背景のピンクへふわっとなじむフェード（より柔らかく） */
    .magic-princess {
      mix-blend-mode: multiply;
      -webkit-mask-image: radial-gradient(ellipse 60% 70% at 50% 48%, #000 0%, rgba(0,0,0,0.92) 30%, rgba(0,0,0,0.55) 60%, rgba(0,0,0,0.15) 85%, transparent 100%);
      mask-image: radial-gradient(ellipse 60% 70% at 50% 48%, #000 0%, rgba(0,0,0,0.92) 30%, rgba(0,0,0,0.55) 60%, rgba(0,0,0,0.15) 85%, transparent 100%);
    }
    /* 黒バラ姫アイコン ── 白背景を抜いて紫ピンク背景になじませる */
    .kurobara-icon {
      mix-blend-mode: multiply;
      -webkit-mask-image: radial-gradient(ellipse 92% 92% at 50% 50%, #000 55%, rgba(0,0,0,0.7) 75%, transparent 100%);
      mask-image: radial-gradient(ellipse 92% 92% at 50% 50%, #000 55%, rgba(0,0,0,0.7) 75%, transparent 100%);
    }
    /* 呼吸法ワークの姫イラスト ── 白背景をしっかり透過してピンクに溶け込ませる */
    .mindful-princess {
      mix-blend-mode: darken;
      opacity: 0.92;
      -webkit-mask-image: radial-gradient(ellipse 55% 62% at 50% 50%, #000 15%, rgba(0,0,0,0.85) 45%, rgba(0,0,0,0.45) 70%, rgba(0,0,0,0.12) 88%, transparent 100%);
      mask-image: radial-gradient(ellipse 55% 62% at 50% 50%, #000 15%, rgba(0,0,0,0.85) 45%, rgba(0,0,0,0.45) 70%, rgba(0,0,0,0.12) 88%, transparent 100%);
    }
    /* 魔法ステッキのアイコン ── ボタンのピンクと馴染ませる */
    .wand-icon {
      mix-blend-mode: multiply;
      -webkit-mask-image: radial-gradient(ellipse 80% 88% at 50% 50%, #000 50%, rgba(0,0,0,0.7) 75%, transparent 100%);
      mask-image: radial-gradient(ellipse 80% 88% at 50% 50%, #000 50%, rgba(0,0,0,0.7) 75%, transparent 100%);
    }
    /* 未来の宝石箱のイラスト ── 中央クリア、外周ふんわり馴染ませる */
    .jewelry-box-img {
      mix-blend-mode: multiply;
      opacity: 0.92;
      -webkit-mask-image: radial-gradient(ellipse 62% 68% at 50% 50%, #000 0%, rgba(0,0,0,0.92) 25%, rgba(0,0,0,0.65) 50%, rgba(0,0,0,0.3) 75%, transparent 100%);
      mask-image: radial-gradient(ellipse 62% 68% at 50% 50%, #000 0%, rgba(0,0,0,0.92) 25%, rgba(0,0,0,0.65) 50%, rgba(0,0,0,0.3) 75%, transparent 100%);
    }
    /* 宝石ボタンの光るエフェクト */
    @keyframes jewelGlow {
      0%   { transform: scale(1); filter: brightness(1); }
      40%  { transform: scale(1.08); filter: brightness(1.25); }
      100% { transform: scale(1); filter: brightness(1); }
    }
    .jewel-glow { animation: jewelGlow 0.8s ease-out; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-presets="react">
    const { useState, useRef, useEffect } = React;

    // ===== localStorage 永続化フック =====
    // useState の代わりに使うと、自動的にブラウザに保存・復元される
    const useLocal = (key, initial) => {
      const [v, setV] = useState(function(){
        try {
          var raw = localStorage.getItem("gokigen_" + key);
          if (raw !== null) return JSON.parse(raw);
        } catch(e){}
        return initial;
      });
      useEffect(function(){
        try { localStorage.setItem("gokigen_" + key, JSON.stringify(v)); } catch(e){}
      }, [v]);
      return [v, setV];
    };

    // ===== 日付ヘルパー =====
    const todayKey = function(d){
      d = d || new Date();
      var y = d.getFullYear();
      var m = String(d.getMonth()+1).padStart(2,"0");
      var dd = String(d.getDate()).padStart(2,"0");
      return y + "-" + m + "-" + dd;
    };

    // ===== 日付つき履歴フック =====
    // 日ごとにスナップショットを保存する。新しい日に開いたらリセット、
    // 過去の日付の記録は localStorage に保存され、グラフ・カレンダーで参照可能。
    const useDaily = (key, initial) => {
      const today = todayKey();
      const storageKey = "gokigen_day_" + today + "_" + key;
      const [v, setV] = useState(function(){
        try {
          var raw = localStorage.getItem(storageKey);
          if (raw !== null) return JSON.parse(raw);
        } catch(e){}
        return initial;
      });
      useEffect(function(){
        try {
          localStorage.setItem(storageKey, JSON.stringify(v));
          // 履歴日付インデックスにも追加
          var dates = [];
          try { dates = JSON.parse(localStorage.getItem("gokigen_dates") || "[]"); } catch(e){}
          if (dates.indexOf(today) < 0) {
            dates.push(today);
            localStorage.setItem("gokigen_dates", JSON.stringify(dates));
          }
        } catch(e){}
      }, [v]);
      return [v, setV];
    };

    // ===== 履歴読み取りヘルパー =====
    // 指定日のレコードを取得（{key: value} 形式）
    const getDayRecord = (dateStr) => {
      var result = {};
      var prefix = "gokigen_day_" + dateStr + "_";
      for (var i=0; i<localStorage.length; i++) {
        var k = localStorage.key(i);
        if (k && k.indexOf(prefix) === 0) {
          var sub = k.slice(prefix.length);
          try { result[sub] = JSON.parse(localStorage.getItem(k)); } catch(e){}
        }
      }
      return result;
    };
    // 記録のあった日付一覧（ソート済み）
    const getRecordedDates = () => {
      try {
        var arr = JSON.parse(localStorage.getItem("gokigen_dates") || "[]");
        return arr.sort();
      } catch(e) { return []; }
    };
    // 直近N日間のキー値を取得（空白日も含む）
    const getRecentDays = (n, key) => {
      var result = [];
      var d = new Date();
      for (var i=n-1; i>=0; i--) {
        var dt = new Date(d.getFullYear(), d.getMonth(), d.getDate()-i);
        var ds = todayKey(dt);
        var rec = getDayRecord(ds);
        result.push({ date: ds, dateObj: dt, value: rec[key] });
      }
      return result;
    };
    // 連続記録日数（今日から遡って何日連続で記録があるか）
    const getStreak = () => {
      var dates = getRecordedDates();
      if (dates.length === 0) return 0;
      var streak = 0;
      var d = new Date();
      for (var i=0; i<365; i++) {
        var ds = todayKey(d);
        if (dates.indexOf(ds) >= 0) {
          streak++;
          d = new Date(d.getFullYear(), d.getMonth(), d.getDate()-1);
        } else {
          break;
        }
      }
      return streak;
    };
    // 特定キーが連続でtrueになった日数
    const getKeyStreak = (key) => {
      var streak = 0;
      var d = new Date();
      for (var i=0; i<365; i++) {
        var rec = getDayRecord(todayKey(d));
        if (rec[key] === true) {
          streak++;
          d = new Date(d.getFullYear(), d.getMonth(), d.getDate()-1);
        } else {
          break;
        }
      }
      return streak;
    };
    // 特定キーが書き込まれた日数（テキストフィールド）
    const getKeyCount = (key) => {
      var dates = getRecordedDates();
      var count = 0;
      for (var i=0; i<dates.length; i++) {
        var rec = getDayRecord(dates[i]);
        if (rec[key] && String(rec[key]).trim().length > 0) count++;
      }
      return count;
    };

    /* --- Inline SVG Icons (lucide代替) --- */
    const Icon = ({ d, className = "w-4 h-4", stroke = 2, fill = "none" }) => (
      <svg viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth={stroke} strokeLinecap="round" strokeLinejoin="round" className={className}>
        {Array.isArray(d) ? d.map((p,i)=>(<path key={i} d={p} />)) : <path d={d} />}
      </svg>
    );
    const Heart = ({className, filled}) => (
      <svg viewBox="0 0 24 24" fill={filled ? "currentColor" : "none"} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
      </svg>
    );
    const Sparkles = ({className}) => (
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.582a.5.5 0 0 1 0 .962L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/>
        <path d="M20 3v4"/><path d="M22 5h-4"/><path d="M4 17v2"/><path d="M5 18H3"/>
      </svg>
    );
    const HomeIcon = ({className}) => <Icon className={className} d={["m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z","M9 22V12h6v10"]} />;
    const BookOpen = ({className}) => <Icon className={className} d={["M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z","M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"]} />;
    const Star = ({className, filled}) => (
      <svg viewBox="0 0 24 24" fill={filled?"currentColor":"none"} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
      </svg>
    );
    const Moon = ({className}) => <Icon className={className} d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />;
    const Droplet = ({className}) => <Icon className={className} d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z" />;
    const Scale = ({className}) => <Icon className={className} d={["m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1","m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1","M7 21h10","M12 3v18","M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2"]} />;
    const Flower2 = ({className}) => <Icon className={className} d={["M12 5a3 3 0 1 1 3 3m-3-3a3 3 0 1 0-3 3m3-3v1M9 8a3 3 0 1 0 3 3M9 8h1m5 0a3 3 0 1 1-3 3m3-3h-1m-2 3v-1","M12 8a2 2 0 1 0 4 0 2 2 0 0 0-4 0z","M12 13v9","M8 22h8"]} />;
    const Dumbbell = ({className}) => <Icon className={className} d={["M14.4 14.4 9.6 9.6","M18.657 21.485a2 2 0 1 1-2.829-2.828l-1.767 1.768a2 2 0 1 1-2.829-2.829l6.364-6.364a2 2 0 1 1 2.829 2.829l-1.768 1.767a2 2 0 1 1 2.828 2.829z","m21.5 21.5-1.4-1.4","M3.9 3.9 2.5 2.5","M6.404 12.768a2 2 0 1 1-2.829-2.829l1.768-1.767a2 2 0 1 1-2.828-2.829l2.828-2.828a2 2 0 1 1 2.829 2.828l1.767-1.768a2 2 0 1 1 2.829 2.829z"]} />;
    const Calendar = ({className}) => <Icon className={className} d={["M8 2v4","M16 2v4","M3 10h18","M3 6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"]} />;
    const Target = ({className}) => (
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>
      </svg>
    );
    const Cloud = ({className}) => <Icon className={className} d="M17.5 19a4.5 4.5 0 1 0 0-9h-1.8A7 7 0 1 0 4 17.4" />;
    const Sun = ({className}) => (
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>
      </svg>
    );
    const Crown = ({className}) => <Icon className={className} d={["M11.562 3.266a.5.5 0 0 1 .876 0L15.39 8.87a1 1 0 0 0 1.516.294L21.183 5.5a.5.5 0 0 1 .798.519l-2.834 10.246a1 1 0 0 1-.956.734H5.81a1 1 0 0 1-.957-.734L2.02 6.02a.5.5 0 0 1 .798-.519l4.276 3.664a1 1 0 0 0 1.516-.294z","M5 21h14"]} />;
    const ChevronRight = ({className}) => <Icon className={className} d="m9 18 6-6-6-6" />;
    const Check = ({className}) => <Icon className={className} d="M20 6 9 17l-5-5" />;

    /* =================================================
     *  装飾SVG
     * ================================================= */
    const Petal = ({className="", style}) => (
      <svg viewBox="0 0 32 32" className={className} style={style}>
        <defs>
          <radialGradient id="pg" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stopColor="#fff" stopOpacity="0.9"/>
            <stop offset="100%" stopColor="#f9a8d4" stopOpacity="0.8"/>
          </radialGradient>
        </defs>
        <path d="M16 4 C20 10 22 14 28 16 C22 18 20 22 16 28 C12 22 10 18 4 16 C10 14 12 10 16 4 Z" fill="url(#pg)"/>
      </svg>
    );
    const TinyRibbon = ({className="", style}) => (
      <svg viewBox="0 0 40 24" className={className} style={style}>
        <path d="M20 12 L10 4 L6 10 L12 12 L6 14 L10 20 Z" fill="#f9a8d4" opacity="0.8"/>
        <path d="M20 12 L30 4 L34 10 L28 12 L34 14 L30 20 Z" fill="#f9a8d4" opacity="0.8"/>
        <circle cx="20" cy="12" r="2.5" fill="#ec4899" opacity="0.7"/>
      </svg>
    );
    const Lace = ({className="", flip=false}) => (
      <svg viewBox="0 0 300 20" className={className} style={{transform: flip?"scaleY(-1)":""}} preserveAspectRatio="none">
        <path d="M0 0 Q15 14 30 0 Q45 14 60 0 Q75 14 90 0 Q105 14 120 0 Q135 14 150 0 Q165 14 180 0 Q195 14 210 0 Q225 14 240 0 Q255 14 270 0 Q285 14 300 0 L300 20 L0 20 Z" fill="#fdf2f8" opacity="0.55"/>
      </svg>
    );

    // 繊細なレース（スカラップ + ドット） — セクション下縁や仕切りに
    const LaceScallop = ({className="", color="#f9a8d4", opacity=0.45}) => (
      <svg viewBox="0 0 320 24" className={className} preserveAspectRatio="none">
        <path d="M0 6 Q20 22 40 6 Q60 22 80 6 Q100 22 120 6 Q140 22 160 6 Q180 22 200 6 Q220 22 240 6 Q260 22 280 6 Q300 22 320 6"
          fill="none" stroke={color} strokeOpacity={opacity} strokeWidth="1.4" strokeLinecap="round"/>
        <g fill={color} fillOpacity={opacity*0.9}>
          {Array.from({length:17},(_,i)=>(<circle key={i} cx={10+i*20} cy="14" r="1.2"/>))}
        </g>
      </svg>
    );

    // 大きめリボン（セクション見出しの左右に添える）
    const Ribbon = ({className="", style}) => (
      <svg viewBox="0 0 48 28" className={className} style={style}>
        <defs>
          <linearGradient id="rib" x1="0" x2="1" y1="0" y2="1">
            <stop offset="0%"  stopColor="#fbcfe8"/>
            <stop offset="100%" stopColor="#f9a8d4"/>

    const MoodWeekChart = () => {
      // 過去7日間のごきげん気分を実データから取得
      const moodMeta = {
        "ごきげん":  {level:5, emoji:"🥰"},
        "おだやか":  {level:4, emoji:"😌"},
        "疲れた":    {level:2, emoji:"😣"},

      const dayLabels = ["月","火","水","木","金","土","日"];
      const recent = getRecentDays(7, "selectedMood");
      const data = recent.map(r => {
        const dow = (r.dateObj.getDay()+6)%7; // Mon=0
        if (r.value && moodMeta[r.value]) {
          return { day: dayLabels[dow], level: moodMeta[r.value].level, emoji: moodMeta[r.value].emoji, label: r.value, hasData: true };
        }
        return { day: dayLabels[dow], level: 3, emoji: "·", label: "未記録", hasData: false };
      });
      // 全日未記録ならメッセージ表示
      const valid = data.filter(d => d.hasData);
      if (valid.length === 0) {
        return (
          <div className="bg-white/55 rounded-[22px] p-4 border border-white/70 backdrop-blur-sm text-center" style={{boxShadow:"0 2px 8px rgba(249,168,212,0.08)"}}>

              ホーム → 朝のごきげんタイムから今日の気分を選んでね ♡
            </div>
          </div>
        );
      }
      const avg = (valid.reduce((a,b)=>a+b.level,0)/valid.length).toFixed(1);
      const W = 320, H = 130, P = 24;
      const innerW = W - P*2, innerH = H - P - 16;
      const xs = data.map((_,i)=> P + (innerW/(data.length-1))*i);
      const ys = data.map(d => P + innerH * (1 - (d.level-1)/4));
      const path = xs.map((x,i)=> `${i===0?"M":"L"}${x},${ys[i]}`).join(" ");
      const labels = ["", "悲しい", "ふつう", "おだやか", "ごきげん"];
      return (
        <div className="bg-white/55 rounded-[22px] p-3 border border-white/70 backdrop-blur-sm" style={{boxShadow:"0 2px 8px rgba(249,168,212,0.08)"}}>
          <svg viewBox={`0 0 ${W} ${H+18}`} className="w-full" style={{height:"148px"}}>
            <defs>
              <linearGradient id="moodLineGrad" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0%" stopColor="#f9a8d4"/>
                <stop offset="100%" stopColor="#fb7185"/>
              </linearGradient>
            </defs>
            {/* グリッド線 1〜5レベル */}
            {[1,2,3,4,5].map(level => {
              const y = P + innerH * (1 - (level-1)/4);
              return (
                <g key={level}>
                  <line x1={P} x2={W-P} y1={y} y2={y} stroke="#fce7f3" strokeDasharray="2 4"/>

    const WeekLineChart = ({data, days=["月","火","水","木","金","土","日"], unit="", lineColor="#f9a8d4", goalLine, goalLabel, accentEmoji}) => {
      const min = 0;
      const max = Math.max(...data, goalLine||0) * 1.15;
      const W = 320, H = 110, P = 24;
      const innerW = W - P*2, innerH = H - P - 10;
      const xs = data.map((_,i)=> P + (innerW/(data.length-1))*i);
      const ys = data.map(v => P + innerH * (1 - (v-min)/(max-min)));
      const path = xs.map((x,i)=> `${i===0?"M":"L"}${x},${ys[i]}`).join(" ");
      const goalY = goalLine!=null ? P + innerH * (1 - (goalLine-min)/(max-min)) : null;
      const avg = (data.reduce((a,b)=>a+b,0)/data.length);
      return (
        <div className="bg-white/55 rounded-[22px] p-3 border border-white/70 backdrop-blur-sm" style={{boxShadow:"0 2px 8px rgba(249,168,212,0.08)"}}>
          <svg viewBox={`0 0 ${W} ${H+12}`} className="w-full" style={{height:"118px"}}>
            {/* グリッド線 */}
            {[0,1,2,3].map(i => (
              <line key={i} x1={P} x2={W-P} y1={P + (innerH/3)*i} y2={P + (innerH/3)*i} stroke="#fce7f3" strokeDasharray="2 4"/>

            {goalY != null && (
              <g>

                <stop offset="100%" stopColor={lineColor} stopOpacity="0"/>

            <path d={`${path} L ${xs[xs.length-1]},${P+innerH} L ${xs[0]},${P+innerH} Z`}

            {/* 折れ線 */}
            <path d={path} fill="none" stroke={lineColor} strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"/>

    /* =================================================

    const MoodCalendar = () => {
      // 今日の日付を自動取得
      const now = new Date();
      const year = now.getFullYear();
      const month = now.getMonth() + 1; // 1-12
      const today = now.getDate();
      // 月の日数
      const daysInMonth = new Date(year, month, 0).getDate();
      // 月初の曜日（月曜始まりに変換: Mon=0, Sun=6）
      const firstDayOfMonth = new Date(year, month-1, 1).getDay(); // Sun=0
      const firstWeekday = (firstDayOfMonth + 6) % 7; // Mon=0, Sun=6
      // 実データから記録のあった日の絵文字を生成
      const moodEmojiMap = {
        "おだやか":"😌", "ごきげん":"🥰", "疲れた":"😣",
        "悲しい":"🥺", "つらい":"😢", "イライラ":"😰",
      };
      const moods = {};
      for (let d=1; d<=daysInMonth; d++) {
        const ds = year + "-" + String(month).padStart(2,"0") + "-" + String(d).padStart(2,"0");
        const rec = getDayRecord(ds);
        if (rec.selectedMood && moodEmojiMap[rec.selectedMood]) {
          moods[d] = moodEmojiMap[rec.selectedMood];
        }
      }
      const cells = [];
      for (let i=0; i<firstWeekday; i++) cells.push(null);
      for (let d=1; d<=daysInMonth; d++) cells.push(d);
      while (cells.length % 7 !== 0) cells.push(null);
      const weekdays = ["月","火","水","木","金","土","日"];
      return (
        <div className="relative rounded-[26px] overflow-hidden backdrop-blur-sm border border-white/70"
          style={{
            background:"linear-gradient(180deg, rgba(255,252,248,0.9), rgba(253,240,246,0.75))",

          }}>

          <div className="relative px-4 pt-4 pb-4">
            {/* ヘッダ：月表示 */}
            <div className="flex items-center justify-between mb-3 px-1">
              <span className="text-[10px] text-purple-400" style={{letterSpacing:"0.3em"}}>◁</span>
              <div className="text-center">
                <p className="text-[10px] text-purple-400 italic" style={{fontFamily:'"Shippori Mincho",serif', letterSpacing:"0.3em"}}>
                  {["January","February","March","April","May","June","July","August","September","October","November","December"][month-1]} {year}
                </p>
                <p className="text-[16px] text-rose-600 mt-0.5"
                  style={{fontFamily:'"Shippori Mincho",serif', fontWeight:700, letterSpacing:"0.18em"}}>
                  {month}月のきろく
                </p>
              </div>
              <span className="text-[10px] text-purple-400" style={{letterSpacing:"0.3em"}}>▷</span>
            </div>

            {/* 曜日 */}
            <div className="grid grid-cols-7 mb-1">
              {weekdays.map((w,i)=>(
                <div key={w} className={`text-center text-[10px] ${i===5?"text-blue-400":i===6?"text-rose-400":"text-gray-400"}`}
                  style={{letterSpacing:"0.1em"}}>{w}</div>
              ))}
            </div>

            {/* 日付セル */}
            <div className="grid grid-cols-7 gap-y-1">
              {cells.map((d,i)=>{
                if (d===null) return <div key={i} className="h-10"/>;
                const wd = i % 7;
                const isToday = d===today;
                const mood = moods[d];
                return (
                  <div key={i} className="flex flex-col items-center justify-center h-10 relative">
                    {isToday && (
                      <span className="absolute inset-1 rounded-full"
                        style={{background:"linear-gradient(180deg,#fbcfe8,#f9a8d4)", boxShadow:"0 2px 6px rgba(244,114,182,0.3)"}}/>
                    )}
                    <span className={`relative text-[11px] ${isToday?"text-white font-bold":wd===5?"text-blue-400":wd===6?"text-rose-400":"text-gray-500"}`}>
                      {d}

                    {mood && !isToday && (
                      <span className="relative text-[10px] -mt-0.5">{mood}</span>
                    )}
                    {isToday && mood && (
                      <span className="relative text-[9px] -mt-0.5 opacity-90">{mood}</span>
                    )}
                  </div>
                );
              })}
            </div>

            <p className="mt-3 text-center text-[10px] text-purple-400" style={{letterSpacing:"0.2em"}}>
              {Object.keys(moods).length} 日、お嬢様の歩みを記録しました

        {keys:["嫌い","きらい","イヤ"],                  suggestions:["感じていていい。","わたしの気持ちを大切に。","無理しなくていい。","自分に正直でいい。"]},
        {keys:["寂しい","さびしい","孤独","ひとり"],     suggestions:["わたしはわたしと一緒。","誰かに頼っていい。","つながっている。","わたしは愛されている。"]},
        {keys:["焦","急"],                                suggestions:["焦らなくていい。","自分のペースでいい。","一つずつ進む。","今のままでいい。"]},

      // 魔法発動時の innerVoice スナップショット
      const [castSnapshot, setCastSnapshot] = useState("");

      // 既にこの気持ちに魔法をかけた状態か
      const alreadyCast = todayMagicWord && innerVoice === castSnapshot;
      // 末尾の句読点を削除するヘルパー
      const stripEndPeriod = (text) => (text || "").replace(/[。！？!?.]+$/, '');

          {oldPatterns:["不安になっても、大丈夫、わたしは守られている","不安になっても大丈夫 わたしは守られている","不安になっても、大丈夫、わたしは守られている。","不安になっても大丈夫 わたしは守られている。","不安は期待の裏返し"], newText:"不安は、期待の裏返し"},
          // 「今のこの瞬間に集中しよう」→ 改行付き
          {oldPatterns:["今のこの瞬間に集中しよう","今のこの瞬間に集中しよう。","今この瞬間、わたしは安全","今この瞬間 わたしは安全"], newText:"今のこの瞬間に、集中しよう"},
          // 「わたしはよく頑張ってる」→ 改行付き
          {oldPatterns:["わたしはよく頑張ってる","わたしはよく頑張ってる。","今日のわたしもよく頑張ってるよ♡"], newText:"わたしは、よく頑張ってる"},
          // 「一歩ずつできる」→「一歩ずつやれば、できる」
          {oldPatterns:["一歩ずつ、できる","一歩ずつ、できる。","一歩ずつできる","一歩ずつできる。"], newText:"一歩ずつやれば、できる"},
          // 「やさしく自分をつつんであげよう」→「やさしく、自分を包んであげよう」
          {oldPatterns:["やさしく自分をつつんであげよう","やさしく自分をつつんであげよう。","やさしく、自分をつつんであげよう","やさしく、自分をつつんであげよう。"], newText:"やさしく、自分を包んであげよう"},
          // 「わたしは大切にされる存在」→「わたしは、大切にされる存在」
          {oldPatterns:["わたしは大切にされる存在","わたしは大切にされる存在。"], newText:"わたしは、大切にされる存在"},
        ];
        let needsUpdate = false;
        const updated = savedCharms.map(c => {
          for (const m of migrations) {
            if (m.oldPatterns.includes(c.text)) {
              needsUpdate = true;
              return {...c, text: m.newText};
            }
          }
          return c;
        });
        if (needsUpdate) setSavedCharms(updated);
      // eslint-disable-next-line react-hooks/exhaustive-deps
      }, []);

      const castMagic = () => {
        if (!innerVoice.trim()) return;

        // 既に同じ気持ちに魔法をかけている場合 → 唱えるモード（同じ言葉を繰り返す）
        if (alreadyCast) {

        // 新しい気持ちの場合 → 魔法変換モード

        // 1400ms 終了 → 新しい魔法の言葉が鏡に定着
        setSparkleActive(true);
        setTimeout(() => {
          const text = innerVoice.toLowerCase();
          let candidates = [];
          for (const item of rewriteMap) {
            if (item.keys.some(k => text.includes(k))) candidates.push(...item.suggestions);
          }
          if (candidates.length === 0) candidates = defaultRewrites;
          const chosen = candidates[Math.floor(Math.random() * candidates.length)];
          setRewriteWord(chosen);
          setTodayMagicWord(chosen);
          setCastSnapshot(innerVoice);
          setChantCount(chantCount + 1);
        }, 700);
        setTimeout(() => setSparkleActive(false), 1400);
      };

      // 気持ちを音声で入力（innerVoice にディクテーション）
      const [isDictating, setIsDictating] = useState(false);
      const dictateRef = useRef(null);
      const startInnerVoiceDictation = () => {
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

        const r = new SR();

        dictateRef.current = r;
        setVoiceHint("🎤 気持ちを話してみて…");
        setIsDictating(true);
        r.onresult = (event) => {
          const transcript = event.results[0][0].transcript;
          setInnerVoice(innerVoice ? (innerVoice + " " + transcript) : transcript);
          setVoiceHint("✨ 書き取りました");

        r.onerror = (e) => { setVoiceHint(e.error==="no-speech"?"音声を認識できませんでした":"音声認識エラー"); setTimeout(()=>setVoiceHint(""),2500); };

        try { r.start(); } catch(e) { setIsDictating(false); }
      };

      const saveCharm = (word) => {

        const today = new Date();
        const date = `${today.getMonth()+1}/${today.getDate()}`;

        setSavedCharms([{text: word, date, jewel}, ...savedCharms]);

        setSavedCharms(savedCharms.filter((_,i) => i !== idx));

      const startVoice = () => {
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SR) { setVoiceHint("この端末は音声認識に対応してないみたい"); setTimeout(()=>setVoiceHint(""),3000); return; }
        if (isListening) { try{recognitionRef.current&&recognitionRef.current.stop();}catch(e){} return; }
        const r = new SR();
        r.lang="ja-JP"; r.continuous=false; r.interimResults=false; r.maxAlternatives=3;
        recognitionRef.current = r;
        setVoiceHint("🎤 聞いています…"); setIsListening(true);
        r.onresult = (event) => {
          const alts = []; for(let i=0;i<event.results[0].length;i++) alts.push(event.results[0][i].transcript);
          const target = todayMagicWord.replace(/[「」、。！？\s]/g, "");

            const clean = t.replace(/[「」、。！？\s]/g, "");
            if (clean.includes(target) || target.includes(clean)) return true;
            let m = 0; for (const ch of target) if (clean.includes(ch)) m++;
            return m >= Math.max(4, Math.floor(target.length * 0.6));
          });
          if (matched) {
            setChantCount(chantCount + 1);
            setSparkleActive(true);
            setTimeout(()=>setSparkleActive(false),1400);
            setVoiceHint("✨ 素晴らしい発音でございました");

          setTimeout(()=>setVoiceHint(""),3000);
        };
        r.onerror = (e) => { setVoiceHint(e.error==="no-speech"?"音声を認識できませんでした":"音声認識エラー"); setTimeout(()=>setVoiceHint(""),2500); };
        r.onend = () => setIsListening(false);
        try { r.start(); } catch(e) { setIsListening(false); }
      };

                    onError={(e)=>{ e.currentTarget.style.display="none"; e.currentTarget.parentElement.innerHTML='<div class="w-full h-full bg-gradient-to-br from-gray-300 to-gray-500 flex items-center justify-center text-white text-[20px]">🎩</div>'; }}/>
                </div>
                <div className="flex-1 rounded-2xl bg-pink-50/80 border border-pink-100 p-2.5">
                  <div className="text-[10.5px] text-rose-700 leading-relaxed" style={{fontFamily:'"Shippori Mincho",serif'}}>
                    {innerVoice.trim()

                <div className="relative shrink-0" style={{width:"55%", aspectRatio:"4/5"}}>

    /* =================================================
     *  MetricSlider — 共通スライダー（ドラッグ可能ゲージ）
     * ================================================= */
    const MetricSlider = ({label, emoji, value, onChange, min=0, max=100, step=1, unit="", leftLabel="軽め", rightLabel="しっかり", ideal, idealMin, idealMax, subValue, barGradient="from-pink-200 via-pink-300 to-rose-400", thumbGradient="from-pink-300 to-rose-400", trackBg="bg-pink-50", borderColor="border-pink-100"}) => {
      const trackRef = useRef(null);
      const update = (clientX) => {
        const el = trackRef.current;
        if (!el) return;
        const rect = el.getBoundingClientRect();
        let pct = (clientX - rect.left) / rect.width;
        pct = Math.max(0, Math.min(1, pct));
        const raw = min + pct * (max - min);
        const stepped = Math.round(raw / step) * step;
        const clamped = Math.max(min, Math.min(max, stepped));
        onChange(Number(clamped.toFixed(step<1?1:0)));
      };
      const onPointerDown = (e) => {
        e.currentTarget.setPointerCapture(e.pointerId);
        update(e.clientX);
      };
      const onPointerMove = (e) => {
        if (!e.currentTarget.hasPointerCapture(e.pointerId)) return;
        update(e.clientX);
      };
      const pct = ((value - min) / (max - min)) * 100;
      const idealPct = ideal != null ? ((ideal - min) / (max - min)) * 100 : null;
      const idealMinPct = idealMin != null ? ((idealMin - min) / (max - min)) * 100 : null;
      const idealMaxPct = idealMax != null ? ((idealMax - min) / (max - min)) * 100 : null;
      const reached = ideal != null ? value >= ideal : (idealMin != null ? value >= idealMin : false);
      const display = step < 1 ? value.toFixed(1) : value;
      return (
        <div className={`rounded-2xl bg-white/70 border ${borderColor} p-3`}>
          <div className="flex items-center justify-between mb-2.5">
            <div className="flex items-center gap-1.5">
              <span className="text-[13px]">{emoji}</span>
              <span className="text-[10.5px] text-rose-500" style={{fontFamily:'"Shippori Mincho",serif', letterSpacing:"0.08em"}}>{label}</span>
            </div>
            <div className="text-right">
              <div className="flex items-baseline justify-end gap-0.5">
                {reached && <span className="text-[10px] mr-0.5">✨</span>}
                <span className="text-[14px] text-rose-600" style={{fontFamily:'"Shippori Mincho",serif', fontWeight:500}}>{display}</span>
                <span className="text-[8.5px] text-rose-400 ml-0.5">{unit}</span>
              </div>
              {subValue && (
                <div className="text-[8.5px] text-rose-400 -mt-0.5" style={{letterSpacing:"0.04em"}}>{subValue}</div>
              )}
            </div>
          </div>
          <div ref={trackRef}
            onPointerDown={onPointerDown}
            onPointerMove={onPointerMove}
            className={`relative h-2.5 rounded-full ${trackBg} cursor-pointer touch-none border ${borderColor}`}
            style={{userSelect:"none"}}>
            <div className={`absolute inset-y-0 left-0 rounded-full bg-gradient-to-r ${barGradient}`}
              style={{width:`${pct}%`}}/>
            {idealMinPct != null && idealMaxPct != null && (
              <div className="absolute inset-y-0 pointer-events-none border-x border-amber-300/60"
                style={{left:`${idealMinPct}%`, width:`${idealMaxPct - idealMinPct}%`, background:"rgba(251,191,36,0.10)"}}/>
            )}
            {idealPct != null && (
              <div className="absolute pointer-events-none flex flex-col items-center"
                style={{left:`${idealPct}%`, top:"50%", transform:"translate(-50%, -50%)"}}>
                <span className={`text-[12px] leading-none ${reached?"text-rose-400":"text-rose-300"}`}
                  style={{textShadow: reached?"0 0 6px rgba(251,191,36,0.6)":"0 0 4px rgba(255,255,255,0.9)", filter:"drop-shadow(0 1px 1px rgba(244,114,182,0.4))"}}>
                  {reached?"★":"☆"}
                </span>
              </div>
            )}
            {idealMinPct != null && idealMaxPct != null && (
              <div className="absolute pointer-events-none flex flex-col items-center"
                style={{left:`${(idealMinPct + idealMaxPct)/2}%`, top:"50%", transform:"translate(-50%, -50%)"}}>
                <span className={`text-[12px] leading-none ${reached?"text-rose-400":"text-rose-300"}`}
                  style={{textShadow: reached?"0 0 6px rgba(251,191,36,0.6)":"0 0 4px rgba(255,255,255,0.9)", filter:"drop-shadow(0 1px 1px rgba(244,114,182,0.4))"}}>
                  {reached?"★":"☆"}
                </span>
              </div>
            )}
            <div className="absolute top-1/2 w-4 h-4 rounded-full bg-white border-2 border-rose-300"
              style={{left:`calc(${pct}% - 8px)`, transform:"translateY(-50%)", boxShadow:"0 2px 6px rgba(244,114,182,0.4)"}}>
              <div className={`absolute inset-1 rounded-full bg-gradient-to-br ${thumbGradient}`}/>
            </div>
          </div>
          <div className="flex justify-between text-[8.5px] text-rose-300 mt-1.5" style={{letterSpacing:"0.08em"}}>
            <span>{leftLabel}</span>
            <span>{rightLabel}</span>
          </div>
        </div>
      );
    };

    /* =================================================
     *  Day4: 私が私の味方になる呼吸ワーク
     * ================================================= */
    const BreathingWorkSection = () => {
      const [openHelp, setOpenHelp] = useState(false);
      const [phase, setPhase] = useState("idle"); // idle / in / hold / out
      const [count, setCount] = useState(0);
      const [running, setRunning] = useState(false);
      const [done, setDone] = useLocal("breath_done_today", false);

      useEffect(() => {
        if (!running) return;
        // 4-4-8呼吸法（吸う4秒・止める4秒・吐く8秒）
        const sequence = [
          {p:"in",   t:4000},
          {p:"hold", t:4000},
          {p:"out",  t:8000},
        ];
        let idx = 0;
        setPhase(sequence[0].p);
        const tick = () => {
          idx = (idx + 1) % sequence.length;
          if (idx === 0) setCount(c => c + 1);
          setPhase(sequence[idx].p);
        };
        const ids = [];
        let acc = 0;
        for (let i = 1; i <= 100; i++) {
          acc += sequence[(i-1) % 3].t;
          ids.push(setTimeout(tick, acc));
        }
        return () => ids.forEach(clearTimeout);
      }, [running]);

      const stop = () => { setRunning(false); setPhase("idle"); setDone(true); };
      const start = () => { setCount(0); setRunning(true); };

      const phaseColor = phase==="in"?"#a78bfa":phase==="out"?"#f9a8d4":phase==="hold"?"#fcd34d":"#e9d5ff";
      const phaseMsg = phase==="in"?"吸う（4秒）":phase==="hold"?"止める（4秒）":phase==="out"?"吐く（8秒）":"準備OK";
      const scale = phase==="in"?1.35:phase==="hold"?1.35:phase==="out"?0.85:1;
      const transDuration = phase==="in"?4000:phase==="hold"?100:phase==="out"?8000:600;

      return (
        <section className="px-5 mt-6">
          <SectionTitle icon={<Sparkles className="w-4 h-4 text-purple-400"/>}>私が私の味方になる呼吸法</SectionTitle>
          <p className="text-[9.5px] text-rose-400 mb-3 px-1" style={{letterSpacing:"0.08em"}}>
            🌬 潜在意識ちゃんとじっくりお話できる、姫の深呼吸メソッド
          </p>
          <div className="rounded-2xl bg-gradient-to-br from-purple-50/70 to-pink-50/70 border border-purple-100 p-4 space-y-3 text-center"
            style={{boxShadow:"0 2px 10px rgba(168,85,247,0.1)"}}>

            <button onClick={()=>setOpenHelp(!openHelp)}
              className="w-full text-left text-[10px] text-purple-600 px-2.5 py-1.5 bg-white/70 rounded-lg border border-purple-100 flex items-center justify-between active:scale-[0.99]"
              style={{fontFamily:'"Shippori Mincho",serif'}}>
              <span>💡 ワークのやり方を見る</span>
              <span className={`transition-transform ${openHelp?"rotate-180":""}`}>⌄</span>
            </button>
            {openHelp && (
              <div className="rounded-lg bg-white/60 border border-purple-100 p-3 text-[10px] text-rose-600 leading-relaxed text-left anim-fade"
                style={{fontFamily:'"Shippori Mincho",serif'}}>
                <div className="text-[11px] text-purple-700 font-bold mb-1">4-4-8呼吸法（イライラや緊張を鎮める）</div>
                <p className="mb-2">ストレスを感じて浅くなった呼吸を深く整え、心を素早く落ち着かせる方法です。</p>
                ①口からゆっくりと息を完全に吐き切ります<br/>
                ②鼻から <b className="text-purple-700">4秒</b> かけて息を吸い、お腹を膨らませます<br/>
                ③息を止めて <b className="text-purple-700">4秒間</b> キープします<br/>
                ④口または鼻から <b className="text-purple-700">8秒</b> かけてゆっくり息を吐き出し、お腹をへこませます
              </div>
            )}

            {/* 呼吸ボール + 中央に姫が瞑想 */}

              {/* 呼吸ボール（姫を中央に内包） */}
              <div className="relative w-72 h-72 flex items-center justify-center">
                {/* 後ろの呼吸ボール */}
                <div className="absolute inset-0 flex items-center justify-center ease-in-out"
                  style={{transform:`scale(${scale})`, transition:`transform ${transDuration}ms ease-in-out`}}>
                  <div className="w-60 h-60 rounded-full"
                    style={{
                      background: `radial-gradient(circle at 30% 28%, #fff 0%, ${phaseColor} 80%)`,
                      boxShadow:`0 0 50px ${phaseColor}aa, inset 0 -6px 14px rgba(255,255,255,0.4)`,
                    }}/>
                </div>
                {/* 中央の瞑想する姫（一緒に呼吸） */}
                <div className="relative ease-in-out"
                  style={{transform:`scale(${0.95 + (scale-1)*0.3})`, transition:`transform ${transDuration}ms ease-in-out`}}>
                  <img src="./mindful.png" alt="瞑想する姫"
                    className="mindful-princess"
                    style={{width:"220px", height:"auto"}}
                    onError={(e)=>{ e.currentTarget.style.display="none"; }}/>
                </div>
              </div>
              {/* 呼吸ガイドの文字（ボールの下） */}
              <div className="mt-3 text-[18px] text-purple-700" style={{fontFamily:'"Shippori Mincho",serif', fontWeight:700, letterSpacing:"0.15em", textShadow:"0 1px 4px rgba(255,255,255,0.7)"}}>

                className="w-full rounded-xl p-2 text-[11px] focus:outline-none resize-none"
                style={{fontFamily:'"Shippori Mincho",serif', background:"#f0fdfa", border:"1px solid #5eead4", color:"#134e4a", fontWeight:500}}/>

              <p className="text-[11px] mb-1 mt-3" style={{fontFamily:'"Shippori Mincho",serif', color:"#115e59", fontWeight:700}}>♢ 親友が同じことを言ってたら、なんて声をかける？</p>
              <textarea value={reframeFriend} onChange={e=>setReframeFriend(e.target.value)}
                placeholder="例：それだけ頑張ってるんだよ、って言うかも"
                rows={2}
                className="w-full rounded-xl p-2 text-[11px] focus:outline-none resize-none"
                style={{fontFamily:'"Shippori Mincho",serif', background:"#f0fdfa", border:"1px solid #5eead4", color:"#134e4a", fontWeight:500}}/>
              </div>
              )}
            </div>
          </div>

          {/* ═══════════════════════════════════════ */}
          {/* Step 5: 私を褒める（濃ピンクテーマ）      */}
          {/* ═══════════════════════════════════════ */}
          <div className="mt-2">
            <div className="rounded-[22px]"
              style={{background:"linear-gradient(180deg,#fdf2f8 0%,#fce7f3 100%)", border:"1.5px solid #ec4899", boxShadow:"0 4px 14px rgba(236,72,153,0.22)"}}>
              <button onClick={()=>setOpenStep(openStep===5?0:5)}
                className="w-full flex items-center justify-between px-4 py-3 text-left">
                <div className="flex items-center gap-2.5">
                  <div className="w-8 h-8 rounded-full text-white text-[12px] font-bold flex items-center justify-center" style={{background:"linear-gradient(135deg,#ec4899,#f472b6)", boxShadow:"0 2px 6px rgba(236,72,153,0.4)"}}>5</div>
                  <div>
                    <div className="text-[9px]" style={{letterSpacing:"0.18em", fontWeight:700, color:"#9d174d"}}>STEP 5 · 認める</div>
                    <div className="text-[13px]" style={{fontFamily:'"Shippori Mincho",serif', fontWeight:700, letterSpacing:"0.08em", color:"#831843"}}>👑 私を褒める</div>
                  </div>
                </div>
                <span className="text-[12px]" style={{color:"#9d174d", fontWeight:700}}>{openStep===5?"▲":"▼"}</span>
              </button>
              {openStep===5 && (
              <div className="px-4 pb-4 anim-fade">

              {/* 執事の吹き出し */}
              <div className="mb-3 flex items-start gap-3">
                <div className="shrink-0"><ButlerAvatar size={54}/></div>
                <div style={{position:"relative", flex:1, background:"linear-gradient(135deg,#ffffff,#fdf2f8)", border:"1.5px solid #ec4899", borderRadius:"16px", padding:"10px 12px", boxShadow:"0 2px 6px rgba(236,72,153,0.18)"}}>
                  <div style={{position:"absolute", left:"-9px", top:"18px", width:0, height:0,
                    borderTop:"8px solid transparent", borderBottom:"8px solid transparent", borderRight:"9px solid #ec4899"}}/>
                  <div style={{position:"absolute", left:"-7px", top:"19px", width:0, height:0,
                    borderTop:"7px solid transparent", borderBottom:"7px solid transparent", borderRight:"7px solid #ffffff"}}/>
                  <div className="text-[10.5px] leading-relaxed" style={{fontFamily:'"Shippori Mincho",serif', color:"#7c2d12"}}>
                    お嬢様、ここまで向き合われたこと、本当に立派でございます。<br/>
                    どうか、今日の自分を、思いきり褒めてあげてくださいませ 👑
                  </div>
                </div>
              </div>

              <p className="text-[10.5px] mb-3" style={{fontFamily:'"Shippori Mincho",serif', color:"#831843", fontWeight:600}}>ここまで来たこと、それだけで100点満点 ♡</p>
              <textarea value={praiseMe} onChange={e=>setPraiseMe(e.target.value)}
                placeholder="例：今日も朝起きられた・大変な中頑張った・自分と向き合った"
                rows={4}
                className="w-full rounded-xl p-2 text-[11px] focus:outline-none resize-none leading-relaxed"
                style={{fontFamily:'"Shippori Mincho",serif', background:"#fdf2f8", border:"1px solid #f9a8d4", color:"#831843", fontWeight:500}}/>
              <p className="text-[9.5px] mt-2 text-center" style={{letterSpacing:"0.1em", color:"#9d174d", fontWeight:600}}>小さいことでいい。自分を認めることが、一番の癒し 💗</p>
              </div>
              )}
            </div>
          </div>

              {/* 大カード閉じ */}
            </div>
          </section>

          {/* ═══ 今すぐできる小さなケア ═══ */}
          <section className="px-5 mt-5">
            <div className="rounded-2xl p-3.5"
              style={{background:"linear-gradient(180deg,#fff7ed 0%,#fef3c7 100%)", border:"1.5px solid #fbbf24", boxShadow:"0 3px 10px rgba(245,158,11,0.15)"}}>
              <div className="mb-2">
                <div style={{fontFamily:'"Shippori Mincho",serif', fontWeight:700, letterSpacing:"0.1em", color:"#7c2d12", fontSize:"14px"}}>
                  🕯️ 今すぐできる小さなケア
                </div>
                <div className="mt-0.5 pl-1" style={{fontFamily:'"Shippori Mincho",serif', color:"#7c2d12", fontSize:"10px"}}>
                  〜 気持ちを整える、ほんの3分の魔法 〜
                </div>
              </div>
              <div className="grid grid-cols-2 gap-2">
                {[
                  {emoji:"🌬️", label:"3回、深呼吸", hint:"鼻から4秒・口から8秒"},
                  {emoji:"🍵", label:"白湯をひとくち", hint:"体からじんわり温まる"},
                  {emoji:"🚶‍♀️", label:"3分だけお散歩", hint:"外の空気に触れる"},
                  {emoji:"🛁", label:"手を温める", hint:"温かいお湯で手を洗う"},
                ].map((c,i)=>(
                  <div key={i} className="rounded-xl px-3 py-2.5"
                    style={{background:"rgba(255,255,255,0.85)", border:"1px solid #fcd34d"}}>
                    <div className="flex items-center gap-2 mb-0.5">
                      <span style={{fontSize:"18px"}}>{c.emoji}</span>
                      <span style={{fontFamily:'"Shippori Mincho",serif', fontSize:"11px", fontWeight:700, color:"#7c2d12"}}>{c.label}</span>
                    </div>
                    <div className="text-[9.5px]" style={{fontFamily:'"Shippori Mincho",serif', color:"#7c2d12", opacity:0.85, paddingLeft:"26px"}}>{c.hint}</div>
                  </div>
                ))}
              </div>
            </div>
          </section>

          {/* ═══ 執事からの声かけ（認める＋次の行動をそっと促す） ═══ */}
          <div className="px-5 mt-5">
            <ButlerCard message={<>
              お嬢様、ここまでよくぞ向き合われました。それだけで、本当に立派でございます ♡<br/>
              少し軽くなられましたら、下のお部屋にも、いつでもお越しくださいませ。
            </>}/>
          </div>
        </div>
      );
    };

    /* =================================================
     *  ROOT
     * ================================================= */
    function App(){
      const [activeTab,setActiveTab] = useState("home");
      const [selectedMood,setSelectedMood] = useDaily("selectedMood", "ごきげん");
      const [analysisType,setAnalysisType] = useState(null);
      const [loading,setLoading] = useState(false);
      const [screenKey,setScreenKey] = useState(0);

      const handleTabChange = (tab) => {
        if(tab===activeTab) return;
        setLoading(true);
        setTimeout(()=>{
          setActiveTab(tab);
          setScreenKey(k=>k+1);
          setLoading(false);
        }, 450);
      };
      const handleOpenAnalysis = (type) => {
        setLoading(true);
        setTimeout(()=>{
          setLoading(false);
          setAnalysisType(type);
        }, 700);
      };

      return (
        <div className="min-h-screen relative">
          <FixedBackground/>
          <div className="relative z-10 max-w-md mx-auto min-h-screen">
            <div key={screenKey}>
              {activeTab==="home"    && <HomeScreen selectedMood={selectedMood} setSelectedMood={setSelectedMood} openAnalysis={handleOpenAnalysis} goLoop={()=>handleTabChange("loop")} goDaily={()=>handleTabChange("daily")} goCare={()=>handleTabChange("care")} goWorld={()=>handleTabChange("world")} goMonthly={()=>handleTabChange("monthly")}/>}
              {activeTab==="daily"   && <DailyScreen/>}
              {activeTab==="loop"    && <LoopScreen selectedMood={selectedMood} setSelectedMood={setSelectedMood}/>}
              {activeTab==="care"    && <CareScreen/>}
              {activeTab==="world"   && <WorldScreen/>}
              {activeTab==="monthly" && <MonthlyScreen goTab={handleTabChange}/>}
            </div>
            <BottomNav activeTab={activeTab} setActiveTab={handleTabChange}/>
            {/* <AnalysisModal type={analysisType} onClose={()=>setAnalysisType(null)}/> */}
            {/* <SparkleLoader visible={loading}/> */}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App/>);
  </script>
  <!-- twemoji は使わない：モダンOS（iOS/Android/macOS/Windows）は標準で綺麗な絵文字を持っているため。
       以前はTwemoji+MutationObserverで全プラットフォーム統一していたが、React更新と置換が
       絡んで「パッパッ」と再描画される問題があったため、ネイティブ絵文字に統一して点滅を撲滅。 -->
  <script>
    /* twemoji 関連の処理は意図的に無効化 */
  </script>
  <style>
    img.twemoji-img { height: 1em; width: 1em; display: inline-block; vertical-align: -0.15em; margin: 0 0.02em; }
    /* タップ・スクロール体験向上 */
    * { -webkit-tap-highlight-color: transparent; }
    /* モバイルでの過剰アニメーション抑制（OS設定で「視差効果を減らす」を ON にしている方向け） */
    @media (prefers-reduced-motion: reduce) {
      .anim-float, .anim-float-emoji, .anim-spin, .anim-spin-r {
        animation: none !important;
      }
    }
  </style>
</body>
</html>
