<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover" />
  <title>ごきげん姫の自分軸</title>
  <meta name="description" content="ごきげん姫の自分軸 — 自分の機嫌を自分でとる、お姫様気分の自己ケアダイアリー" />
  <!-- iOS ホーム画面アイコン & アプリ名設定 -->
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />

  <link rel="manifest" href="./manifest.json" />

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    html, body, #root { height: 100%; }
    body {
      font-family: "Zen Maru Gothic","Hiragino Maru Gothic ProN","M PLUS Rounded 1c",system-ui,sans-serif;
      background: linear-gradient(180deg,#fdf2f8 0%,#fdf4fb 50%,#f5f0fb 100%);
      -webkit-font-smoothing: antialiased;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    @keyframes floatY {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    @keyframes floatEmoji {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }
    @keyframes spin360 {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes spin360r {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }
    .anim-fade { animation: fadeIn .5s ease; }
    .anim-slide { animation: slideUp .4s cubic-bezier(.16,1,.3,1); }
    .anim-float { animation: floatY 4s ease-in-out infinite; }
    .anim-float-emoji { animation: floatEmoji 2.5s ease-in-out infinite; }
    .anim-spin { animation: spin360 3s linear infinite; }
    .anim-spin-r { animation: spin360r 2s linear infinite; }
    input, textarea { font-family: inherit; }
    /* 選択時のハイライト色 */
    ::selection { background: #fbcfe8; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-presets="react">
    const { useState, useRef, useEffect } = React;

    // ===== localStorage 永続化フック =====
    // useState の代わりに使うと、自動的にブラウザに保存・復元される
    const useLocal = (key, initial) => {
      const [v, setV] = useState(function(){
        try {
          var raw = localStorage.getItem("gokigen_" + key);
          if (raw !== null) return JSON.parse(raw);
        } catch(e){}
        return initial;
      });
      useEffect(function(){
        try { localStorage.setItem("gokigen_" + key, JSON.stringify(v)); } catch(e){}
      }, [v]);
      return [v, setV];
    };

    // ===== 日付ヘルパー =====
    const todayKey = function(d){
      d = d || new Date();
      var y = d.getFullYear();
      var m = String(d.getMonth()+1).padStart(2,"0");
      var dd = String(d.getDate()).padStart(2,"0");
      return y + "-" + m + "-" + dd;
    };

    // ===== 日付つき履歴フック =====
    // 日ごとにスナップショットを保存する。新しい日に開いたらリセット、
    // 過去の日付の記録は localStorage に保存され、グラフ・カレンダーで参照可能。
    const useDaily = (key, initial) => {
      const today = todayKey();
      const storageKey = "gokigen_day_" + today + "_" + key;
      const [v, setV] = useState(function(){
        try {
          var raw = localStorage.getItem(storageKey);
          if (raw !== null) return JSON.parse(raw);
        } catch(e){}
        return initial;
      });
      useEffect(function(){
        try {
          localStorage.setItem(storageKey, JSON.stringify(v));
          // 履歴日付インデックスにも追加
          var dates = [];
          try { dates = JSON.parse(localStorage.getItem("gokigen_dates") || "[]"); } catch(e){}
          if (dates.indexOf(today) < 0) {
            dates.push(today);
            localStorage.setItem("gokigen_dates", JSON.stringify(dates));
          }
        } catch(e){}
      }, [v]);
      return [v, setV];
    };

    // ===== 履歴読み取りヘルパー =====
    // 指定日のレコードを取得（{key: value} 形式）
    const getDayRecord = (dateStr) => {
      var result = {};
      var prefix = "gokigen_day_" + dateStr + "_";
      for (var i=0; i<localStorage.length; i++) {
        var k = localStorage.key(i);
        if (k && k.indexOf(prefix) === 0) {
          var sub = k.slice(prefix.length);
          try { result[sub] = JSON.parse(localStorage.getItem(k)); } catch(e){}
        }
      }
      return result;
    };
    // 記録のあった日付一覧（ソート済み）
    const getRecordedDates = () => {
      try {
        var arr = JSON.parse(localStorage.getItem("gokigen_dates") || "[]");
        return arr.sort();
      } catch(e) { return []; }
    };
    // 直近N日間のキー値を取得（空白日も含む）
    const getRecentDays = (n, key) => {
      var result = [];
      var d = new Date();
      for (var i=n-1; i>=0; i--) {
        var dt = new Date(d.getFullYear(), d.getMonth(), d.getDate()-i);
        var ds = todayKey(dt);
        var rec = getDayRecord(ds);
        result.push({ date: ds, dateObj: dt, value: rec[key] });
      }
      return result;
    };
    // 連続記録日数（今日から遡って何日連続で記録があるか）
    const getStreak = () => {
      var dates = getRecordedDates();
      if (dates.length === 0) return 0;
      var streak = 0;
      var d = new Date();
      for (var i=0; i<365; i++) {
        var ds = todayKey(d);
        if (dates.indexOf(ds) >= 0) {
          streak++;
          d = new Date(d.getFullYear(), d.getMonth(), d.getDate()-1);
        } else {
          break;
        }
      }
      return streak;
    };
    // 特定キーが連続でtrueになった日数
    const getKeyStreak = (key) => {
      var streak = 0;
      var d = new Date();
      for (var i=0; i<365; i++) {
        var rec = getDayRecord(todayKey(d));
        if (rec[key] === true) {
          streak++;
          d = new Date(d.getFullYear(), d.getMonth(), d.getDate()-1);
        } else {
          break;
        }
      }
      return streak;
    };
    // 特定キーが書き込まれた日数（テキストフィールド）
    const getKeyCount = (key) => {
      var dates = getRecordedDates();
      var count = 0;
      for (var i=0; i<dates.length; i++) {
        var rec = getDayRecord(dates[i]);
        if (rec[key] && String(rec[key]).trim().length > 0) count++;
      }
      return count;
    };

    /* --- Inline SVG Icons (lucide代替) --- */
    const Icon = ({ d, className = "w-4 h-4", stroke = 2, fill = "none" }) => (
      <svg viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth={stroke} strokeLinecap="round" strokeLinejoin="round" className={className}>
        {Array.isArray(d) ? d.map((p,i)=>(<path key={i} d={p} />)) : <path d={d} />}
      </svg>
    );
    const Heart = ({className, filled}) => (
      <svg viewBox="0 0 24 24" fill={filled ? "currentColor" : "none"} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
      </svg>

    const Sparkles = ({className}) => (

        <path d="M20 3v4"/><path d="M22 5h-4"/><path d="M4 17v2"/><path d="M5 18H3"/>
      </svg>

    const HomeIcon = ({className}) => <Icon className={className} d={["m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z","M9 22V12h6v10"]} />;
    const BookOpen = ({className}) => <Icon className={className} d={["M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z","M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"]} />;
    const Star = ({className, filled}) => (
      <svg viewBox="0 0 24 24" fill={filled?"currentColor":"none"} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>

    const Moon = ({className}) => <Icon className={className} d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />;
    const Droplet = ({className}) => <Icon className={className} d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z" />;
    const Scale = ({className}) => <Icon className={className} d={["m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1","m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1","M7 21h10","M12 3v18","M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2"]} />;
    const Flower2 = ({className}) => <Icon className={className} d={["M12 5a3 3 0 1 1 3 3m-3-3a3 3 0 1 0-3 3m3-3v1M9 8a3 3 0 1 0 3 3M9 8h1m5 0a3 3 0 1 1-3 3m3-3h-1m-2 3v-1","M12 8a2 2 0 1 0 4 0 2 2 0 0 0-4 0z","M12 13v9","M8 22h8"]} />;
    const Dumbbell = ({className}) => <Icon className={className} d={["M14.4 14.4 9.6 9.6","M18.657 21.485a2 2 0 1 1-2.829-2.828l-1.767 1.768a2 2 0 1 1-2.829-2.829l6.364-6.364a2 2 0 1 1 2.829 2.829l-1.768 1.767a2 2 0 1 1 2.828 2.829z","m21.5 21.5-1.4-1.4","M3.9 3.9 2.5 2.5","M6.404 12.768a2 2 0 1 1-2.829-2.829l1.768-1.767a2 2 0 1 1-2.828-2.829l2.828-2.828a2 2 0 1 1 2.829 2.828l1.767-1.768a2 2 0 1 1 2.829 2.829z"]} />;
    const Calendar = ({className}) => <Icon className={className} d={["M8 2v4","M16 2v4","M3 10h18","M3 6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"]} />;
    const Target = ({className}) => (
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>
      </svg>
    );
    const Cloud = ({className}) => <Icon className={className} d="M17.5 19a4.5 4.5 0 1 0 0-9h-1.8A7 7 0 1 0 4 17.4" />;
    const Sun = ({className}) => (
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>
      </svg>
    );
    const Crown = ({className}) => <Icon className={className} d={["M11.562 3.266a.5.5 0 0 1 .876 0L15.39 8.87a1 1 0 0 0 1.516.294L21.183 5.5a.5.5 0 0 1 .798.519l-2.834 10.246a1 1 0 0 1-.956.734H5.81a1 1 0 0 1-.957-.734L2.02 6.02a.5.5 0 0 1 .798-.519l4.276 3.664a1 1 0 0 0 1.516-.294z","M5 21h14"]} />;
    const ChevronRight = ({className}) => <Icon className={className} d="m9 18 6-6-6-6" />;
    const Check = ({className}) => <Icon className={className} d="M20 6 9 17l-5-5" />;

    /* =================================================
     *  装飾SVG
     * ================================================= */
    const Petal = ({className="", style}) => (
      <svg viewBox="0 0 32 32" className={className} style={style}>
        <defs>
          <radialGradient id="pg" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stopColor="#fff" stopOpacity="0.9"/>
            <stop offset="100%" stopColor="#f9a8d4" stopOpacity="0.8"/>
          </radialGradient>
        </defs>
        <path d="M16 4 C20 10 22 14 28 16 C22 18 20 22 16 28 C12 22 10 18 4 16 C10 14 12 10 16 4 Z" fill="url(#pg)"/>
      </svg>
    );
    const TinyRibbon = ({className="", style}) => (
      <svg viewBox="0 0 40 24" className={className} style={style}>
        <path d="M20 12 L10 4 L6 10 L12 12 L6 14 L10 20 Z" fill="#f9a8d4" opacity="0.8"/>
        <path d="M20 12 L30 4 L34 10 L28 12 L34 14 L30 20 Z" fill="#f9a8d4" opacity="0.8"/>
        <circle cx="20" cy="12" r="2.5" fill="#ec4899" opacity="0.7"/>
      </svg>
    );
    const Lace = ({className="", flip=false}) => (
      <svg viewBox="0 0 300 20" className={className} style={{transform: flip?"scaleY(-1)":""}} preserveAspectRatio="none">
        <path d="M0 0 Q15 14 30 0 Q45 14 60 0 Q75 14 90 0 Q105 14 120 0 Q135 14 150 0 Q165 14 180 0 Q195 14 210 0 Q225 14 240 0 Q255 14 270 0 Q285 14 300 0 L300 20 L0 20 Z" fill="#fdf2f8" opacity="0.55"/>
      </svg>
    );

    // 繊細なレース（スカラップ + ドット） — セクション下縁や仕切りに
    const LaceScallop = ({className="", color="#f9a8d4", opacity=0.45}) => (
      <svg viewBox="0 0 320 24" className={className} preserveAspectRatio="none">
        <path d="M0 6 Q20 22 40 6 Q60 22 80 6 Q100 22 120 6 Q140 22 160 6 Q180 22 200 6 Q220 22 240 6 Q260 22 280 6 Q300 22 320 6"
          fill="none" stroke={color} strokeOpacity={opacity} strokeWidth="1.4" strokeLinecap="round"/>
        <g fill={color} fillOpacity={opacity*0.9}>
          {Array.from({length:17},(_,i)=>(<circle key={i} cx={10+i*20} cy="14" r="1.2"/>))}
        </g>
      </svg>
    );

    // 大きめリボン（セクション見出しの左右に添える）
    const Ribbon = ({className="", style}) => (
      <svg viewBox="0 0 48 28" className={className} style={style}>
        <defs>
          <linearGradient id="rib" x1="0" x2="1" y1="0" y2="1">
            <stop offset="0%"  stopColor="#fbcfe8"/>
            <stop offset="100%" stopColor="#f9a8d4"/>
          </linearGradient>
        </defs>
        <path d="M24 14 L4 4 Q2 4 2 6 L8 14 L2 22 Q2 24 4 24 Z" fill="url(#rib)"/>
        <path d="M24 14 L44 4 Q46 4 46 6 L40 14 L46 22 Q46 24 44 24 Z" fill="url(#rib)"/>
        <ellipse cx="24" cy="14" rx="3.5" ry="5" fill="#ec4899" fillOpacity="0.75"/>
        <path d="M22 18 L20 27" stroke="#f9a8d4" strokeWidth="1.5" strokeLinecap="round"/>
        <path d="M26 18 L28 27" stroke="#f9a8d4" strokeWidth="1.5" strokeLinecap="round"/>
      </svg>
    );

    // お城のイラスト（水彩風PNG、背景透過）
    const CASTLE_IMG = "./castle_t.png";
    const CastleBg = ({className="", style, opacity=0.35}) => (
      <img src={CASTLE_IMG} alt="" aria-hidden
        onError={(e)=>{ e.currentTarget.style.visibility="hidden"; }}
        className={className}
        style={{
          objectFit:"contain",
          objectPosition:"center bottom",
          opacity,
          filter:"drop-shadow(0 4px 10px rgba(249,168,212,0.15))",
          ...style
        }}
      />
    );

    // 馬車（ペガサス付き・可愛らしい簡略イラスト）
    const Carriage = ({className="", style}) => (
      <svg viewBox="0 0 80 48" className={className} style={style}>
        <defs>
          <linearGradient id="carBody" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0%"  stopColor="#fff5fa"/>
            <stop offset="100%" stopColor="#fbcfe8"/>
          </linearGradient>
        </defs>
        {/* ペガサス */}
        <g transform="translate(2,14)">
          <ellipse cx="9" cy="16" rx="8" ry="5" fill="#fdfaf6" stroke="#e9bfa8" strokeWidth="0.8"/>
          <circle cx="15" cy="12" r="3.4" fill="#fdfaf6" stroke="#e9bfa8" strokeWidth="0.8"/>
          <path d="M15 9 L17 4 L17 9 Z" fill="#f9a8d4"/>
          <path d="M2 14 Q-1 10 4 10 Q5 12 3 14 Z" fill="#d1e7fa" opacity="0.75"/>
          <line x1="7"  y1="20" x2="7"  y2="24" stroke="#e9bfa8" strokeWidth="1.2"/>
          <line x1="12" y1="20" x2="12" y2="24" stroke="#e9bfa8" strokeWidth="1.2"/>
          <circle cx="16" cy="11.5" r="0.5" fill="#555"/>
        </g>
        {/* 馬車本体 */}
        <g transform="translate(36,10)">
          <path d="M6 18 Q6 4 20 4 Q34 4 34 18 Q34 30 20 30 Q6 30 6 18 Z" fill="url(#carBody)" stroke="#ec4899" strokeOpacity="0.45" strokeWidth="0.8"/>
          <rect x="15" y="9" width="10" height="12" rx="5" fill="#fff" stroke="#ec4899" strokeOpacity="0.45" strokeWidth="0.7"/>
          <path d="M20 4 L20 1 M17 2 L23 2" stroke="#ec4899" strokeOpacity="0.6" strokeWidth="0.8"/>
          {/* 車輪 */}
          <circle cx="12" cy="34" r="5" fill="none" stroke="#ec4899" strokeOpacity="0.55" strokeWidth="1"/>
          <circle cx="12" cy="34" r="1.2" fill="#f9a8d4"/>
          <line x1="7"  y1="34" x2="17" y2="34" stroke="#ec4899" strokeOpacity="0.35" strokeWidth="0.6"/>
          <line x1="12" y1="29" x2="12" y2="39" stroke="#ec4899" strokeOpacity="0.35" strokeWidth="0.6"/>
          <circle cx="28" cy="34" r="5" fill="none" stroke="#ec4899" strokeOpacity="0.55" strokeWidth="1"/>
          <circle cx="28" cy="34" r="1.2" fill="#f9a8d4"/>
          <line x1="23" y1="34" x2="33" y2="34" stroke="#ec4899" strokeOpacity="0.35" strokeWidth="0.6"/>
          <line x1="28" y1="29" x2="28" y2="39" stroke="#ec4899" strokeOpacity="0.35" strokeWidth="0.6"/>
        </g>
        {/* つなぎ */}
        <line x1="20" y1="30" x2="40" y2="30" stroke="#e9bfa8" strokeWidth="1.2"/>
      </svg>
    );

    // リボン付きお城の王冠風アイコン（ごきげんメーターなどに）
    const CastleTiny = ({className="", style}) => (
      <svg viewBox="0 0 32 32" className={className} style={style}>
        <rect x="6" y="16" width="20" height="12" fill="#fdfaf6" stroke="#e9bfa8" strokeWidth="0.8"/>
        <polygon points="4,16 12,16 8,9"  fill="#a5d8f0"/>
        <polygon points="12,16 20,16 16,7" fill="#a5d8f0"/>
        <polygon points="20,16 28,16 24,9" fill="#a5d8f0"/>
        <rect x="14" y="20" width="4" height="8" rx="2" fill="#f4d9c2"/>
        <circle cx="16" cy="5" r="1" fill="#f9a8d4"/>

    /* =================================================
     *  添付画像（水彩絵本シリーズ）
     * ================================================= */
    // 白背景を透過処理した PNG を使用（水彩のピンク地と自然に馴染む）
    const PRINCESS_IMG     = "./princess_t.png";
    const BUTLER_IMG       = "./butler.png";
    const YOGA_IMG         = "./yoga_t.png";
    const GIFT_IMG         = "./gokigen_t.png";
    const DIARY_IMG        = "./diary_t.png";
    const ACHIEVEMENT_IMG  = "./achievement_t.png";
    const HAPPY_IMG        = "./happy_t.png";
    const MENTAL_IMG       = "./mental_t.png";
    const PILATES_IMG      = "./pilates_t.png";
    const WATER_IMG        = "./water_t.png";

    const PrincessImage = ({className=""}) => (
      <img src={PRINCESS_IMG} alt="" aria-hidden className={className}
        onError={(e)=>{ e.currentTarget.style.visibility="hidden"; }}

    /* シーンイラスト：透過PNGを水彩背景に直接重ねる */
    const SceneArt = ({src, alt="", height=170}) => (
      <div className="relative mx-5 mt-3 mb-1 flex items-center justify-center" style={{height}}>
        {/* うしろにそっとにじむ水彩スポット */}
        <div className="absolute inset-x-6 inset-y-2 rounded-full" style={{

      const filled = data.map((v,i) => v !== null ? v : (data.find(x => x !== null) || 0));
      const minV = Math.min(...filled)-0.3, maxV = Math.max(...filled)+0.3;
      const range = maxV-minV || 1;
      const W = 320, H = 90, P = 20;
      const innerW = W-P*2, innerH = H-P-10;
      const xs = filled.map((_,i)=> P + (innerW/(filled.length-1))*i);
      const ys = filled.map(v => P + innerH * (1 - (v-minV)/range));
      const path = xs.map((x,i)=> `${i===0?"M":"L"}${x},${ys[i]}`).join(" ");
      return (
        <div className="bg-white/55 rounded-[22px] p-3 border border-white/70 backdrop-blur-sm" style={{boxShadow:"0 2px 8px rgba(249,168,212,0.08)"}}>
          <svg viewBox={`0 0 ${W} ${H+12}`} className="w-full h-28">
            {/* grid */}
            {[0,1,2].map(i => (
              <line key={i} x1={P} x2={W-P} y1={P + (innerH/2)*i} y2={P + (innerH/2)*i} stroke="#fce7f3" strokeDasharray="2 4"/>
            ))}
            <path d={path} fill="none" stroke="#f9a8d4" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>
            {xs.map((x,i)=>(
              <circle key={i} cx={x} cy={ys[i]} r={data[i]!==null?"3":"2"} fill={data[i]!==null?"#f472b6":"#fbcfe8"}/>
            ))}
            {days.map((d,i)=>(
              <text key={i} x={xs[i]} y={H+8} fontSize="10" fill="#c4a6b8" textAnchor="middle">{d}</text>
            ))}
          </svg>
        </div>
      );

    /* =================================================
     *  MetricSlider — 共通スライダー（ドラッグ可能ゲージ）
     * ================================================= */
    const MetricSlider = ({label, emoji, value, onChange, min=0, max=100, step=1, unit="", leftLabel="軽め", rightLabel="しっかり", ideal, idealMin, idealMax, subValue, barGradient="from-pink-200 via-pink-300 to-rose-400", thumbGradient="from-pink-300 to-rose-400", trackBg="bg-pink-50", borderColor="border-pink-100"}) => {
      const trackRef = useRef(null);
      const update = (clientX) => {
        const el = trackRef.current;
        if (!el) return;
        const rect = el.getBoundingClientRect();
        let pct = (clientX - rect.left) / rect.width;
        pct = Math.max(0, Math.min(1, pct));
        const raw = min + pct * (max - min);
        const stepped = Math.round(raw / step) * step;
        const clamped = Math.max(min, Math.min(max, stepped));
        onChange(Number(clamped.toFixed(step<1?1:0)));
      };
      const onPointerDown = (e) => {
        e.currentTarget.setPointerCapture(e.pointerId);
        update(e.clientX);
      };
      const onPointerMove = (e) => {
        if (!e.currentTarget.hasPointerCapture(e.pointerId)) return;
        update(e.clientX);
      };
      const pct = ((value - min) / (max - min)) * 100;
      const idealPct = ideal != null ? ((ideal - min) / (max - min)) * 100 : null;
      const idealMinPct = idealMin != null ? ((idealMin - min) / (max - min)) * 100 : null;
      const idealMaxPct = idealMax != null ? ((idealMax - min) / (max - min)) * 100 : null;
      const reached = ideal != null ? value >= ideal : (idealMin != null ? value >= idealMin : false);
      const display = step < 1 ? value.toFixed(1) : value;
      return (
        <div className={`rounded-2xl bg-white/70 border ${borderColor} p-3`}>
          <div className="flex items-center justify-between mb-2.5">
            <div className="flex items-center gap-1.5">
              <span className="text-[13px]">{emoji}</span>
              <span className="text-[10.5px] text-rose-500" style={{fontFamily:'"Shippori Mincho",serif', letterSpacing:"0.08em"}}>{label}</span>
            </div>
            <div className="text-right">
              <div className="flex items-baseline justify-end gap-0.5">
                {reached && <span className="text-[10px] mr-0.5">✨</span>}
                <span className="text-[14px] text-rose-600" style={{fontFamily:'"Shippori Mincho",serif', fontWeight:500}}>{display}</span>
                <span className="text-[8.5px] text-rose-400 ml-0.5">{unit}</span>
              </div>
              {subValue && (
                <div className="text-[8.5px] text-rose-400 -mt-0.5" style={{letterSpacing:"0.04em"}}>{subValue}</div>
              )}
            </div>
          </div>
          <div ref={trackRef}
            onPointerDown={onPointerDown}
            onPointerMove={onPointerMove}
            className={`relative h-2.5 rounded-full ${trackBg} cursor-pointer touch-none border ${borderColor}`}
            style={{userSelect:"none"}}>
            <div className={`absolute inset-y-0 left-0 rounded-full bg-gradient-to-r ${barGradient}`}
              style={{width:`${pct}%`}}/>
            {idealMinPct != null && idealMaxPct != null && (
              <div className="absolute inset-y-0 pointer-events-none border-x border-amber-300/60"
                style={{left:`${idealMinPct}%`, width:`${idealMaxPct - idealMinPct}%`, background:"rgba(251,191,36,0.10)"}}/>
            )}
            {idealPct != null && (
              <div className="absolute pointer-events-none flex flex-col items-center"
                style={{left:`${idealPct}%`, top:"50%", transform:"translate(-50%, -50%)"}}>
                <span className={`text-[12px] leading-none ${reached?"text-amber-400":"text-rose-300"}`}
                  style={{textShadow: reached?"0 0 6px rgba(251,191,36,0.6)":"0 0 4px rgba(255,255,255,0.9)", filter:"drop-shadow(0 1px 1px rgba(244,114,182,0.4))"}}>
                  {reached?"★":"☆"}
                </span>
              </div>
            )}
            {idealMinPct != null && idealMaxPct != null && (
              <div className="absolute pointer-events-none flex flex-col items-center"
                style={{left:`${(idealMinPct + idealMaxPct)/2}%`, top:"50%", transform:"translate(-50%, -50%)"}}>
                <span className={`text-[12px] leading-none ${reached?"text-amber-400":"text-rose-300"}`}
                  style={{textShadow: reached?"0 0 6px rgba(251,191,36,0.6)":"0 0 4px rgba(255,255,255,0.9)", filter:"drop-shadow(0 1px 1px rgba(244,114,182,0.4))"}}>
                  {reached?"★":"☆"}
                </span>
              </div>
            )}
            <div className="absolute top-1/2 w-4 h-4 rounded-full bg-white border-2 border-rose-300"
              style={{left:`calc(${pct}% - 8px)`, transform:"translateY(-50%)", boxShadow:"0 2px 6px rgba(244,114,182,0.4)"}}>
              <div className={`absolute inset-1 rounded-full bg-gradient-to-br ${thumbGradient}`}/>
            </div>
          </div>
          <div className="flex justify-between text-[8.5px] text-rose-300 mt-1.5" style={{letterSpacing:"0.08em"}}>
            <span>{leftLabel}</span>
            <span>{rightLabel}</span>
          </div>
        </div>
      );
    };

            <SectionCard>

                {Array.from({length:daysInMonth}).map((_,i)=>{

                <span>💠 吉日 15</span><span>🌕 満月 22</span><span>🌑 新月 8</span>

                  {label:"♢ 気づき・成長・学び",     v:refGrow,   set:setRefGrow,   p:"今月の発見を…"},
                ].map((f,i)=>(
                  <div key={i}>
                    <p className="text-[11px] text-rose-500 mb-1" style={{fontFamily:'"Shippori Mincho",serif'}}>{f.label}</p>
                    <textarea value={f.v} onChange={e=>f.set(e.target.value)} placeholder={f.p} rows={2}
                      className="w-full bg-white/70 border border-pink-100 rounded-xl p-2 text-[11px] text-gray-600 placeholder:text-pink-300 focus:outline-none focus:border-pink-300 resize-none"/>
                  </div>
                ))}
                {/* ごきげん・メーター */}
                <div className="rounded-2xl bg-white/60 border border-pink-100 p-3 mt-2 space-y-2">
                  <p className="text-[11px] text-rose-500 text-center" style={{fontFamily:'"Shippori Mincho",serif'}}>✨ ごきげん・メーター ✨</p>
                  <p className="text-[9px] text-rose-300 text-center -mt-1" style={{letterSpacing:"0.1em"}}>今月、どれくらいだった？</p>
                  <MetricSlider
                    label="くすみモード" emoji="☁️" unit="％" max={100} step={5}
                    value={refDark} onChange={setRefDark}

                  <textarea value={refDarkNote} onChange={e=>setRefDarkNote(e.target.value)}
                    placeholder="自分を責めてしまったときの言葉、これからどうしてあげる？" rows={2}
                    className="w-full bg-white/70 border border-pink-100 rounded-xl p-2 text-[10px] text-gray-600 placeholder:text-pink-300 focus:outline-none resize-none"/>
                  <MetricSlider

                      <div className="text-[14px] text-rose-600" style={{fontFamily:'"Shippori Mincho",serif'}}>{refDark}<span className="text-[8px] text-rose-400">％</span></div>
                    </div>
                    <div className="text-rose-300 text-[10px]">／</div>
                    <div className="text-center">
                      <div className="text-[8.5px] text-rose-400" style={{letterSpacing:"0.1em"}}>きらめき</div>
                      <div className="text-[14px] text-rose-600" style={{fontFamily:'"Shippori Mincho",serif'}}>{refLight}<span className="text-[8px] text-rose-400">％</span></div>
                    </div>
                    <div className="text-rose-300 text-[10px]">／</div>
                    <div className="text-center">
                      <div className="text-[8.5px] text-rose-400" style={{letterSpacing:"0.1em"}}>バランス</div>
                      <div className="text-[14px] text-rose-600" style={{fontFamily:'"Shippori Mincho",serif'}}>{refLight>=refDark?"☀️":"🌙"} {Math.max(0,refLight-refDark)}</div>
                    </div>
                  </div>
                </div>
              </div>
            </SectionCard>
          </section>

          <div className="px-5 mt-5"><ButlerCard message="今月のお嬢様、本当にお美しくいらっしゃいました。"/></div>
        </div>
      );
    };

    /* =================================================
     *  ROOT
     * ================================================= */
    function App(){
      const [activeTab,setActiveTab] = useState("home");
      const [selectedMood,setSelectedMood] = useDaily("selectedMood", "ごきげん");
      const [analysisType,setAnalysisType] = useState(null);
      const [loading,setLoading] = useState(false);
      const [screenKey,setScreenKey] = useState(0);

      const handleTabChange = (tab) => {
        if(tab===activeTab) return;
        setLoading(true);
        setTimeout(()=>{
          setActiveTab(tab);
          setScreenKey(k=>k+1);
          setLoading(false);
        }, 450);
      };
      const handleOpenAnalysis = (type) => {
        setLoading(true);
        setTimeout(()=>{
          setLoading(false);
          setAnalysisType(type);
        }, 700);
      };

      return (
        <div className="min-h-screen relative">
          <FixedBackground/>
          <div className="relative z-10 max-w-md mx-auto min-h-screen">
            <div key={screenKey}>
              {activeTab==="home"    && <HomeScreen selectedMood={selectedMood} setSelectedMood={setSelectedMood} openAnalysis={handleOpenAnalysis} goLoop={()=>handleTabChange("loop")} goDaily={()=>handleTabChange("daily")} goCare={()=>handleTabChange("care")} goWorld={()=>handleTabChange("world")} goMonthly={()=>handleTabChange("monthly")}/>}
              {activeTab==="daily"   && <DailyScreen/>}
              {activeTab==="loop"    && <LoopScreen selectedMood={selectedMood} setSelectedMood={setSelectedMood}/>}
              {activeTab==="care"    && <CareScreen/>}
              {activeTab==="world"   && <WorldScreen/>}
              {activeTab==="monthly" && <MonthlyScreen/>}
            </div>
            <BottomNav activeTab={activeTab} setActiveTab={handleTabChange}/>
            <AnalysisModal type={analysisType} onClose={()=>setAnalysisType(null)}/>
            <SparkleLoader visible={loading}/>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App/>);
  </script>
  <script src="./twemoji.min.js"></script>
  <script>
    // iOS は美しいネイティブ絵文字があるので twemoji 置換をスキップ
    // パチパチのちらつきを防ぐため、setIntervalは廃止し MutationObserver でDOM変化時だけ実行
    (function(){
      var ua = navigator.userAgent || "";
      var isIOS = /iPhone|iPad|iPod/.test(ua) || (/Mac/.test(ua) && navigator.maxTouchPoints > 1);
      // iOS なら twemoji 完全スキップ（ネイティブ絵文字を使う）
      if (isIOS) return;
      if (!window.twemoji) return;

      var pending = false;
      var observer = null;
      function applyTwemoji(){
        // パース中の DOM 変化が再帰的に observer を発火しないように一時停止
        if (observer) observer.disconnect();
        twemoji.parse(document.body, {
          callback: function(icon){ return './twemoji/' + icon + '.svg'; },
          className: 'twemoji-img'
        });
        pending = false;
        if (observer) observer.observe(document.body, { childList: true, subtree: true });
      }
      // 最初の描画後に一度だけ
      setTimeout(applyTwemoji, 400);
      // DOMの変化を監視してデバウンス実行（800ms ごとの強制再描画を廃止）
      observer = new MutationObserver(function(){
        if (pending) return;
        pending = true;
        setTimeout(applyTwemoji, 800);
      });
      observer.observe(document.body, { childList: true, subtree: true });
    })();
  </script>
  <style>
    img.twemoji-img { height: 1em; width: 1em; display: inline-block; vertical-align: -0.15em; margin: 0 0.02em; }
    /* タップ・スクロール体験向上 */
    * { -webkit-tap-highlight-color: transparent; }
    /* モバイルでの過剰アニメーション抑制（OS設定で「視差効果を減らす」を ON にしている方向け） */
    @media (prefers-reduced-motion: reduce) {
      .anim-float, .anim-float-emoji, .anim-spin, .anim-spin-r {
        animation: none !important;
      }
    }
  </style>
