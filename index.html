<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
  <title>ごきげん姫ダイアリー</title>
  <link rel="stylesheet" href="./tw-output.css" />
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    html, body, #root { height: 100%; }
    body {
      font-family: "Zen Maru Gothic","Hiragino Maru Gothic ProN","M PLUS Rounded 1c",system-ui,sans-serif;
      background: linear-gradient(180deg,#fdf2f8 0%,#fdf4fb 50%,#f5f0fb 100%);
      -webkit-font-smoothing: antialiased;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    @keyframes floatY {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    @keyframes floatEmoji {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }
    @keyframes spin360 {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes spin360r {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }
    .anim-fade { animation: fadeIn .5s ease; }
    .anim-slide { animation: slideUp .4s cubic-bezier(.16,1,.3,1); }
    .anim-float { animation: floatY 4s ease-in-out infinite; }
    .anim-float-emoji { animation: floatEmoji 2.5s ease-in-out infinite; }
    .anim-spin { animation: spin360 3s linear infinite; }
    .anim-spin-r { animation: spin360r 2s linear infinite; }
    input, textarea { font-family: inherit; }
    /* 選択時のハイライト色 */
    ::selection { background: #fbcfe8; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-presets="react">
    const { useState } = React;

    /* --- Inline SVG Icons (lucide代替) --- */
    const Icon = ({ d, className = "w-4 h-4", stroke = 2, fill = "none" }) => (
      <svg viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth={stroke} strokeLinecap="round" strokeLinejoin="round" className={className}>
        {Array.isArray(d) ? d.map((p,i)=>(<path key={i} d={p} />)) : <path d={d} />}
      </svg>
    );
    const Heart = ({className, filled}) => (
      <svg viewBox="0 0 24 24" fill={filled ? "currentColor" : "none"} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
      </svg>
    );
    const Sparkles = ({className}) => (
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.582a.5.5 0 0 1 0 .962L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/>
        <path d="M20 3v4"/><path d="M22 5h-4"/><path d="M4 17v2"/><path d="M5 18H3"/>
      </svg>
    );
    const HomeIcon = ({className}) => <Icon className={className} d={["m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z","M9 22V12h6v10"]} />;
    const BookOpen = ({className}) => <Icon className={className} d={["M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z","M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"]} />;
    const Star = ({className, filled}) => (
      <svg viewBox="0 0 24 24" fill={filled?"currentColor":"none"} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
      </svg>

    const Moon = ({className}) => <Icon className={className} d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />;
    const Droplet = ({className}) => <Icon className={className} d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z" />;
    const Scale = ({className}) => <Icon className={className} d={["m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1","m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1","M7 21h10","M12 3v18","M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2"]} />;
    const Flower2 = ({className}) => <Icon className={className} d={["M12 5a3 3 0 1 1 3 3m-3-3a3 3 0 1 0-3 3m3-3v1M9 8a3 3 0 1 0 3 3M9 8h1m5 0a3 3 0 1 1-3 3m3-3h-1m-2 3v-1","M12 8a2 2 0 1 0 4 0 2 2 0 0 0-4 0z","M12 13v9","M8 22h8"]} />;
    const Dumbbell = ({className}) => <Icon className={className} d={["M14.4 14.4 9.6 9.6","M18.657 21.485a2 2 0 1 1-2.829-2.828l-1.767 1.768a2 2 0 1 1-2.829-2.829l6.364-6.364a2 2 0 1 1 2.829 2.829l-1.768 1.767a2 2 0 1 1 2.828 2.829z","m21.5 21.5-1.4-1.4","M3.9 3.9 2.5 2.5","M6.404 12.768a2 2 0 1 1-2.829-2.829l1.768-1.767a2 2 0 1 1-2.828-2.829l2.828-2.828a2 2 0 1 1 2.829 2.828l1.767-1.768a2 2 0 1 1 2.829 2.829z"]} />;
    const Calendar = ({className}) => <Icon className={className} d={["M8 2v4","M16 2v4","M3 10h18","M3 6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"]} />;
    const Target = ({className}) => (

    const Cloud = ({className}) => <Icon className={className} d="M17.5 19a4.5 4.5 0 1 0 0-9h-1.8A7 7 0 1 0 4 17.4" />;
    const Sun = ({className}) => (

    /* =================================================

      </svg>

    /* =================================================
     *  添付画像（水彩絵本シリーズ）
     * ================================================= */
    // 白背景を透過処理した PNG を使用（水彩のピンク地と自然に馴染む）
    const PRINCESS_IMG     = "./princess_t.png";
    const BUTLER_IMG       = "./butler.png";
    const YOGA_IMG         = "./yoga_t.png";
    const GIFT_IMG         = "./gokigen_t.png";
    const DIARY_IMG        = "./diary_t.png";
    const ACHIEVEMENT_IMG  = "./achievement_t.png";
    const HAPPY_IMG        = "./happy_t.png";
    const MENTAL_IMG       = "./mental_t.png";
    const PILATES_IMG      = "./pilates_t.png";
    const WATER_IMG        = "./water_t.png";

    const PrincessImage = ({className=""}) => (
      <img src={PRINCESS_IMG} alt="" aria-hidden className={className}
        onError={(e)=>{ e.currentTarget.style.visibility="hidden"; }}
        style={{filter:"drop-shadow(0 2px 6px rgba(244,114,182,0.12))"}}
      />
    );

    /* シーンイラスト：透過PNGを水彩背景に直接重ねる */
    const SceneArt = ({src, alt="", height=170}) => (
      <div className="relative mx-5 mt-3 mb-1 flex items-center justify-center" style={{height}}>
        {/* うしろにそっとにじむ水彩スポット */}
        <div className="absolute inset-x-6 inset-y-2 rounded-full" style={{
          background:"radial-gradient(ellipse, rgba(253,233,241,0.55) 0%, rgba(253,233,241,0) 70%)",
          filter:"blur(6px)"
        }}/>
        <img src={src} alt={alt}
          onError={(e)=>{ e.currentTarget.style.visibility="hidden"; }}
          style={{maxHeight:"100%", maxWidth:"80%", filter:"drop-shadow(0 6px 12px rgba(244,114,182,0.14))"}}/>
      </div>
    );

    const ButlerAvatar = ({size=56}) => (
      <div className="relative rounded-full overflow-hidden shadow-[0_4px_10px_rgba(139,92,246,0.15)]"
        style={{width:size, height:size, border:"3px solid rgba(255,255,255,0.9)"}}>
        <div className="absolute inset-0 bg-gradient-to-br from-purple-100 to-pink-100"/>
        <img src={BUTLER_IMG} alt="" aria-hidden className="relative w-full h-full object-cover"
          style={{objectPosition:"center 18%", filter:"saturate(0.95) brightness(1.02)"}}
          onError={(e)=>{ e.currentTarget.style.display="none"; }}
        />
      </div>
    );

    /* =================================================
     *  固定背景（水彩絵本風 / 星なし）
     * ================================================= */
    const FixedBackground = () => (
      <div className="fixed inset-0 pointer-events-none overflow-hidden z-0">
        {/* クリーム〜桜色のやさしい紙の色 */}
        <div className="absolute inset-0" style={{background:"linear-gradient(180deg,#fff8f4 0%,#fdeef2 48%,#f3eafb 100%)"}}/>
        {/* 水彩のにじみ：大きな円をぼかして重ねる */}
        <div className="absolute -top-20 -left-16 w-80 h-80 rounded-full"
          style={{background:"radial-gradient(closest-side, rgba(251,207,232,0.55), rgba(251,207,232,0) 75%)", filter:"blur(14px)"}}/>
        <div className="absolute top-[22%] -right-24 w-[22rem] h-[22rem] rounded-full"
          style={{background:"radial-gradient(closest-side, rgba(233,213,255,0.42), rgba(233,213,255,0) 75%)", filter:"blur(18px)"}}/>
        <div className="absolute top-[55%] -left-20 w-72 h-72 rounded-full"
          style={{background:"radial-gradient(closest-side, rgba(255,228,230,0.55), rgba(255,228,230,0) 75%)", filter:"blur(16px)"}}/>
        <div className="absolute bottom-0 right-[-10%] w-[22rem] h-[22rem] rounded-full"
          style={{background:"radial-gradient(closest-side, rgba(253,230,138,0.22), rgba(253,230,138,0) 75%)", filter:"blur(20px)"}}/>
        {/* 水彩のかすれ線風に紙目テクスチャ */}
        <div className="absolute inset-0" style={{
          background:"repeating-linear-gradient(45deg, rgba(255,255,255,0.04) 0 2px, transparent 2px 6px)",
          mixBlendMode:"overlay", opacity:0.5
        }}/>
      </div>
    );

    /* =================================================
     *  ヘッダー（リボン風フレーム + プリンセス）
     * ================================================= */
    const AppHeader = ({subtitle}) => (
      <div className="relative pt-9 pb-3 px-5">
        <div className="relative rounded-[28px] overflow-hidden bg-gradient-to-br from-white/70 via-pink-50/60 to-purple-50/60 backdrop-blur-sm border border-white/70"
          style={{boxShadow:"0 6px 20px rgba(249,168,212,0.14)"}}>
          <div className="absolute -top-10 -left-10 w-32 h-32 bg-white/50 rounded-full" style={{filter:"blur(40px)"}}/>
          <div className="absolute -bottom-10 -right-10 w-32 h-32 bg-pink-100/40 rounded-full" style={{filter:"blur(40px)"}}/>
          {/* 水彩的なやわらかい雰囲気。装飾要素は最小限に */}

          <div className="relative flex items-center px-5 py-5">
            <div className="flex-1 min-w-0">
              <p className="text-[17px] text-rose-700 leading-none"
                style={{fontFamily:'"Shippori Mincho","Noto Serif JP",serif', fontWeight:600, letterSpacing:"0.18em"}}>
                ごきげん姫
              </p>
              <p className="mt-1.5 text-[13px] text-rose-500"
                style={{fontFamily:'"Shippori Mincho","Noto Serif JP",serif', fontWeight:500, letterSpacing:"0.35em"}}>
                ダイアリー
              </p>
              <p className="mt-3 text-[9px] text-purple-500 italic" style={{fontFamily:'"Shippori Mincho",serif', letterSpacing:"0.3em"}}>
                ─ Gokigen Hime Diary ─
              </p>
              {subtitle && (<p className="mt-1 text-[10px] text-rose-400/90" style={{letterSpacing:"0.2em"}}>{subtitle}</p>)}
            </div>

            <div className="relative w-[96px] h-[120px] flex-shrink-0 anim-float" style={{marginRight:-4}}>
              <PrincessImage className="relative w-full h-full object-contain" />
            </div>
          </div>
        </div>
      </div>
    );

    /* =================================================
     *  執事カード
     * ================================================= */
    const ButlerCard = ({message}) => (
      <div className="relative">
        <div className="absolute -inset-1 rounded-[32px] opacity-60"
          style={{background:"linear-gradient(90deg, rgba(251,207,232,0.5), rgba(233,213,255,0.5), rgba(251,207,232,0.5))", filter:"blur(20px)"}}/>
        <div className="relative rounded-[26px] overflow-hidden bg-gradient-to-br from-white/80 via-pink-50/50 to-purple-50/50 backdrop-blur-sm border border-white/80"
          style={{boxShadow:"0 4px 16px rgba(196,181,253,0.14)"}}>
          <div className="absolute -top-8 -left-8 w-24 h-24 bg-white/50 rounded-full" style={{filter:"blur(40px)"}}/>
          {/* 執事カード：水彩のにじみで統一 */}

          <div className="relative flex items-start gap-4 p-5">
            <div className="flex-shrink-0 relative">
              <div className="absolute inset-0 rounded-full bg-pink-100/40" style={{filter:"blur(10px)"}}/>
              <div className="relative"><ButlerAvatar size={56}/></div>
            </div>
            <div className="flex-1 min-w-0 pt-1">
              <div className="flex items-center gap-1.5 mb-2">
                <p className="text-[11px] text-purple-500" style={{fontFamily:'"Shippori Mincho","Noto Serif JP",serif', letterSpacing:"0.2em"}}>
                  執事 · ルシアン=グレイ
                </p>
                <Sparkles className="w-3 h-3 text-pink-300"/>
              </div>
              <p className="text-[13px] text-gray-700" style={{lineHeight:2, letterSpacing:"0.04em"}}>{message}</p>
            </div>

    /* =================================================
     *  共通
     * ================================================= */
    const SectionTitle = ({children, icon}) => (
      <div className="flex items-center gap-2 mb-3 pl-1">
        {icon}
        <h2 className="text-[13px] text-rose-600"
          style={{fontFamily:'"Shippori Mincho","Noto Serif JP",serif', fontWeight:500, letterSpacing:"0.18em"}}>
          {children}
        </h2>
        <div className="flex-1 h-px" style={{background:"linear-gradient(90deg,#fbcfe8,transparent)"}}/>
      </div>
    );

    const SectionCard = ({children, className=""}) => (
      <div className={`relative rounded-[24px] p-5 border border-white/70 bg-gradient-to-br from-white/75 via-pink-50/50 to-white/70 backdrop-blur-sm ${className}`}
        style={{boxShadow:"0 4px 14px rgba(249,168,212,0.09)"}}>
        {children}
      </div>
    );

    const moods = [
      {emoji:"😌",label:"おだやか"},
      {emoji:"🥰",label:"ごきげん"},
      {emoji:"😣",label:"疲れた"},
      {emoji:"🥺",label:"悲しい"},
      {emoji:"😢",label:"つらい"},
      {emoji:"😰",label:"イライラ"},
    ];

    // ② 繊細なゆらぎ（複数選択OK）
    const feelingTags = [
      {label:"モヤモヤする"},
      {label:"ザワザワする"},
      {label:"気分がゆらぐ"},
      {label:"ふと落ち込む"},
      {label:"なんとなく不安"},
      {label:"ぐるぐる思考"},
      {label:"脳疲労ぎみ"},
      {label:"過緊張"},
    ];

    // ③ お身体の状態（複数選択OK）
    const bodyTags = [
      {label:"頭が重い"},
      {label:"首・肩がこる"},
      {label:"お腹がゆるい・はる"},
      {label:"めまい・ふらつき"},
      {label:"吐き気・気持ち悪い"},
      {label:"ドキドキする"},
      {label:"呼吸が浅い"},
      {label:"全体的に疲れぎみ"},
    ];

    // 姫のごきげんになれるモノ（3×4 = 12）
    const favoriteCategories = [
      {label:"食べもの・のみもの", hint:"いちごのケーキ"},
      {label:"色",                 hint:"淡いピンク"},
      {label:"動物",               hint:"白い子猫"},
      {label:"音楽",               hint:"お気に入りの曲"},
      {label:"香り",               hint:"ローズの香り"},
      {label:"本",                 hint:"大切な一冊"},
      {label:"映画",               hint:"心ときめく作品"},
      {label:"場所",               hint:"お店・観光地"},
      {label:"おうちの中",         hint:"お気に入りの場所"},
      {label:"グッズ",             hint:"ずっと愛用中"},
      {label:"言葉",               hint:"お守りの言葉"},
      {label:"お花",               hint:"大好きなお花"},
    ];

    // 睡眠ラベル（1〜5）
    const sleepLabels = [
      "あまり眠れず",
      "少し浅め",
      "ふつう",
      "よく眠れた",
      "ぐっすり",
    ];

    /* =================================================
     *  シンプル線グラフ（recharts代替）
     * ================================================= */
    const WeightChart = () => {
      const data = [52.4,52.2,52.3,52.0,51.9,51.8,51.8];
      const days = ["月","火","水","木","金","土","日"];
      const min = Math.min(...data)-0.3, max = Math.max(...data)+0.3;
      const W = 320, H = 90, P = 20;
      const innerW = W-P*2, innerH = H-P-10;
      const xs = data.map((_,i)=> P + (innerW/(data.length-1))*i);
      const ys = data.map(v => P + innerH * (1 - (v-min)/(max-min)));
      const path = xs.map((x,i)=> `${i===0?"M":"L"}${x},${ys[i]}`).join(" ");
      return (
        <div className="bg-white/55 rounded-[22px] p-3 border border-white/70 backdrop-blur-sm" style={{boxShadow:"0 2px 8px rgba(249,168,212,0.08)"}}>
          <svg viewBox={`0 0 ${W} ${H+12}`} className="w-full h-28">
            {/* grid */}
            {[0,1,2].map(i => (
              <line key={i} x1={P} x2={W-P} y1={P + (innerH/2)*i} y2={P + (innerH/2)*i} stroke="#fce7f3" strokeDasharray="2 4"/>
            ))}
            <path d={path} fill="none" stroke="#f9a8d4" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>
            {xs.map((x,i)=>(
              <circle key={i} cx={x} cy={ys[i]} r="3" fill="#f472b6"/>
            ))}
            {days.map((d,i)=>(
              <text key={i} x={xs[i]} y={H+8} fontSize="10" fill="#c4a6b8" textAnchor="middle">{d}</text>
            ))}
          </svg>
        </div>
      );
    };

    /* =================================================
     *  歩数計（ごきげん姫の一歩一歩）
     * ================================================= */
    const Pedometer = ({steps=5646, goal=8000}) => {
      const pct = Math.min(steps/goal, 1);
      const R = 96, C = 2*Math.PI*R;
      const dash = C*pct;
      return (
        <div className="relative rounded-[26px] overflow-hidden backdrop-blur-sm border border-white/70"
          style={{
            background:"linear-gradient(180deg, rgba(255,247,251,0.85), rgba(253,238,242,0.75))",

    /* =================================================

    const MoodCalendar = () => {
      // 2026年4月、1日は水曜、月曜始まり→月火の前に 2 マス空ける
      const year = 2026, month = 4;
      const daysInMonth = 30;
      const firstWeekday = 2; // Mon=0, Tue=1, Wed=2
      // 例: 記録のあった日付 -> 絵文字
      const moods = {
        1:"😊", 2:"🌸", 3:"😊", 5:"✨", 6:"😴", 7:"🌸",
        8:"😊", 10:"💕", 11:"🌸", 12:"✨", 14:"😊", 15:"🌸",
        16:"😊", 17:"💕", 19:"🌸", 20:"😊"
      };
      const today = 19;
      const cells = [];
      for (let i=0; i<firstWeekday; i++) cells.push(null);
      for (let d=1; d<=daysInMonth; d++) cells.push(d);
      while (cells.length % 7 !== 0) cells.push(null);
      const weekdays = ["月","火","水","木","金","土","日"];
      return (
        <div className="relative rounded-[26px] overflow-hidden backdrop-blur-sm border border-white/70"
          style={{
            background:"linear-gradient(180deg, rgba(255,252,248,0.9), rgba(253,240,246,0.75))",
            boxShadow:"0 4px 16px rgba(249,168,212,0.1)"
          }}>
          <div className="absolute -top-6 -right-6 w-24 h-24 rounded-full"
            style={{background:"radial-gradient(closest-side, rgba(233,213,255,0.5), transparent 70%)", filter:"blur(10px)"}}/>
          <div className="relative px-4 pt-4 pb-4">
            {/* ヘッダ：月表示 */}
            <div className="flex items-center justify-between mb-3 px-1">
              <span className="text-[10px] text-purple-400" style={{letterSpacing:"0.3em"}}>◁</span>
              <div className="text-center">
                <p className="text-[10px] text-purple-400 italic" style={{fontFamily:'"Shippori Mincho",serif', letterSpacing:"0.3em"}}>
                  April {year}
                </p>
                <p className="text-[16px] text-rose-600 mt-0.5"
                  style={{fontFamily:'"Shippori Mincho",serif', fontWeight:700, letterSpacing:"0.18em"}}>
                  {month}月のきろく
                </p>
              </div>
              <span className="text-[10px] text-purple-400" style={{letterSpacing:"0.3em"}}>▷</span>
            </div>

            {/* 曜日 */}
            <div className="grid grid-cols-7 mb-1">
              {weekdays.map((w,i)=>(
                <div key={w} className={`text-center text-[10px] ${i===5?"text-blue-400":i===6?"text-rose-400":"text-gray-400"}`}
                  style={{letterSpacing:"0.1em"}}>{w}</div>
              ))}
            </div>

            {/* 日付セル */}
            <div className="grid grid-cols-7 gap-y-1">
              {cells.map((d,i)=>{
                if (d===null) return <div key={i} className="h-10"/>;
                const wd = i % 7;
                const isToday = d===today;
                const mood = moods[d];
                return (
                  <div key={i} className="flex flex-col items-center justify-center h-10 relative">
                    {isToday && (
                      <span className="absolute inset-1 rounded-full"
                        style={{background:"linear-gradient(180deg,#fbcfe8,#f9a8d4)", boxShadow:"0 2px 6px rgba(244,114,182,0.3)"}}/>
                    )}
                    <span className={`relative text-[11px] ${isToday?"text-white font-bold":wd===5?"text-blue-400":wd===6?"text-rose-400":"text-gray-500"}`}>
                      {d}
                    </span>
                    {mood && !isToday && (
                      <span className="relative text-[10px] -mt-0.5">{mood}</span>
                    )}
                    {isToday && mood && (
                      <span className="relative text-[9px] -mt-0.5 opacity-90">{mood}</span>
                    )}
                  </div>
                );
              })}
            </div>

            <p className="mt-3 text-center text-[10px] text-purple-400" style={{letterSpacing:"0.2em"}}>
              {Object.keys(moods).length} 日、お嬢様の歩みを記録しました
            </p>
          </div>
        </div>
      );
    };

                <ResultRow label="彩り" value="お花のよう 🌸"/>
              </>) : (<>
                <ResultRow label="運動量" value="ほどよく"/>
                <ResultRow label="姿勢" value="美しい"/>
                <ResultRow label="印象" value="凛としたしなやかさ ✨"/>
              </>)}
            </div>
            <div className="mt-4 bg-purple-50/60 rounded-2xl p-3 border border-purple-100 flex items-start gap-3">
              <div className="flex-shrink-0"><ButlerAvatar size={40}/></div>
              <p className="text-[11px] text-gray-600 pt-1" style={{lineHeight:1.9}}>
                {isMeal ? "丁寧に召し上がる時間は、お嬢様を内側から輝かせますね。" : "今日のお嬢様の姿勢、とても美しゅうございます。"}
              </p>
            </div>
            <div className="grid grid-cols-2 gap-3 mt-5">
              <button onClick={onClose} className="bg-white text-gray-400 py-3 rounded-full border border-pink-100 text-[12px] active:scale-95 transition" style={{letterSpacing:"0.15em"}}>閉じる</button>
              <button onClick={onClose} className="text-white py-3 rounded-full text-[12px] font-medium active:scale-95 transition"
                style={{
                  background:"linear-gradient(90deg,#f4b4c6,#eaa3b6)",
                  boxShadow:"0 4px 12px rgba(234,163,182,0.25)",
                  letterSpacing:"0.15em"
                }}>この内容で記録</button>
            </div>
          </div>
        </div>
      );
    };

    /* =================================================
     *  LOADING
     * ================================================= */
    const SparkleLoader = ({visible}) => {
      if(!visible) return null;
      return (
        <div className="fixed inset-0 flex items-center justify-center z-[60] anim-fade"
          style={{background:"rgba(255,255,255,0.7)", backdropFilter:"blur(8px)"}}>
          <div className="relative">
            <div className="absolute inset-0 rounded-full bg-pink-200/50" style={{filter:"blur(20px)"}}/>
            <div className="relative flex items-center justify-center">
              <Sparkles className="w-10 h-10 text-pink-400 anim-spin"/>
              <Sparkles className="absolute w-6 h-6 text-purple-300 anim-spin-r"/>
            </div>
          </div>
        </div>
      );
    };

    /* =================================================
     *  PRINCESS DAILY SCREEN  （プリンセスデイリー）
     *    ・プリンセスケア（穴埋め形式のセルフケア宣言）
     *    ・Image（もしも…の想像）
     *    ・プリンセスデイリー（朝／昼／夜の姫習慣）
     * ================================================= */
    const InlineInput = ({value,onChange,placeholder,className=""}) => (
      <input type="text" value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder}
        className={`inline-block align-baseline bg-pink-100/60 border-b-2 border-pink-200 px-2 py-0.5 rounded-md text-[12px] text-rose-600 placeholder:text-pink-300/80 focus:outline-none focus:bg-pink-100 focus:border-pink-400 transition-colors ${className}`}
        style={{minWidth:130, letterSpacing:"0.03em"}}/>
    );

    const HimeHabitCard = ({title,emoji,accent,value,onChange,placeholder}) => (
      <div className={`relative rounded-2xl bg-gradient-to-b ${accent} border border-white/70 p-2 flex flex-col overflow-hidden`}
        style={{minHeight:168, boxShadow:"0 2px 8px rgba(249,168,212,0.15)"}}>
        <div className="absolute top-1 left-1 text-[10px] text-pink-200">◆</div>
        <div className="absolute top-1 right-1 text-[10px] text-pink-200">◆</div>
        <div className="absolute bottom-1 left-1 text-[10px] text-pink-200">◆</div>
        <div className="absolute bottom-1 right-1 text-[10px] text-pink-200">◆</div>
        <div className="text-center text-[20px] mt-1 mb-0.5">{emoji}</div>
        <div className="text-[10px] text-rose-500 text-center mb-1.5"
          style={{fontFamily:'"Shippori Mincho",serif', fontWeight:600, letterSpacing:"0.08em"}}>
          {title}
        </div>
        <textarea value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder}
          rows={5}
          className="flex-1 w-full bg-white/70 rounded-xl p-2 text-[10px] text-gray-600 placeholder:text-pink-300 focus:outline-none resize-none"
          style={{lineHeight:1.5}}/>
      </div>
    );

    const PrincessDailyScreen = () => {
      const [dailyCare,  setDailyCare]  = useState("");
      const [extraCare,  setExtraCare]  = useState("");
      const [bodyCare,   setBodyCare]   = useState("");
      const [mindCare,   setMindCare]   = useState("");
      const [stressCare, setStressCare] = useState("");
      const [monthDream, setMonthDream] = useState("");
      const [yearDream,  setYearDream]  = useState("");
      const [richDream,  setRichDream]  = useState("");
      const [morning,    setMorning]    = useState("");
      const [noon,       setNoon]       = useState("");
      const [night,      setNight]      = useState("");

      return (
        <div className="relative pb-28 anim-fade">
          <AppHeader subtitle="〜 姫の優雅な毎日 〜"/>
          <div className="px-5 mt-4">
            <ButlerCard message="姫は自分のことがとっても大切です。セルフケアをしてかわいがりましょう。"/>
          </div>

          {/* ① プリンセスケア */}
          <section className="px-5 mt-7">
            <SectionTitle icon={<Sparkles className="w-4 h-4 text-pink-400"/>}>プリンセスケア</SectionTitle>
            <SectionCard>
              <div className="text-[11px] text-rose-500 mb-3 text-center"
                style={{lineHeight:1.9, fontFamily:'"Shippori Mincho",serif'}}>
                姫は自分のことがとっても大切です ♥<br/>
                セルフケアをしてかわいがります ♥
              </div>
              <div className="space-y-3">
                <div className="text-[12px] text-gray-600" style={{lineHeight:1.9}}>
                  姫は日々心身の美しさを保つために
                </div>
                <div className="flex flex-wrap items-baseline gap-y-2 text-[12px] text-gray-600" style={{lineHeight:1.9}}>
                  <InlineInput value={dailyCare} onChange={setDailyCare} placeholder="スキンケア" className="flex-1"/>
                  <span>をします。</span>
                </div>
                <div className="flex flex-wrap items-baseline gap-y-2 text-[12px] text-gray-600" style={{lineHeight:1.9}}>
                  <InlineInput value={extraCare} onChange={setExtraCare} placeholder="ゆっくり半身浴" className="flex-1"/>
                  <span>もしちゃいます。</span>
                </div>
                <div className="flex flex-wrap items-baseline gap-y-2 text-[12px] text-gray-600" style={{lineHeight:1.9}}>
                  <span>身体のために</span>
                  <InlineInput value={bodyCare} onChange={setBodyCare} placeholder="ストレッチ" className="flex-1"/>
                  <span>をしてあげます。</span>
                </div>
                <div className="flex flex-wrap items-baseline gap-y-2 text-[12px] text-gray-600" style={{lineHeight:1.9}}>
                  <span>心のために</span>
                  <InlineInput value={mindCare} onChange={setMindCare} placeholder="好きな音楽を聴く" className="flex-1"/>
                  <span>をしてあげます。</span>
                </div>
              </div>
              <div className="mt-4 pt-4 border-t border-pink-100 text-[11px] text-rose-500 text-center"
                style={{lineHeight:1.9, fontFamily:'"Shippori Mincho",serif'}}>
                姫はセルフケアが得意です ♥<br/>
                ストレスもためないように日頃からこうしてケアします
              </div>
              <div className="mt-3 space-y-2">
                <div className="text-[12px] text-gray-600" style={{lineHeight:1.9}}>
                  万が一、ストレスがたまってしまった時は
                </div>
                <div className="flex flex-wrap items-baseline gap-y-2 text-[12px] text-gray-600" style={{lineHeight:1.9}}>
                  <InlineInput value={stressCare} onChange={setStressCare} placeholder="大好きなスイーツ" className="flex-1"/>
                  <span>をします。</span>
                </div>
              </div>
              <div className="mt-3 text-[11px] text-rose-500 text-center"
                style={{fontFamily:'"Shippori Mincho",serif'}}>
                するとまたかわいく元気な姫に戻ります ♥
              </div>
            </SectionCard>
          </section>

          {/* ② Image（もしも…） */}
          <section className="px-5 mt-7">
            <SectionTitle icon={<Star className="w-4 h-4 text-pink-400"/>}>Image（もしも…）</SectionTitle>
            <SectionCard>
              <div className="space-y-4">
                <div>
                  <div className="text-[11px] text-rose-400 mb-1.5 flex items-center gap-1.5">
                    <span className="text-pink-300 text-[8px]">◆</span>
                    <span style={{letterSpacing:"0.05em"}}>姫は1ヶ月休みがあったら</span>
                  </div>
                  <div className="flex flex-wrap items-baseline gap-2 text-[12px] text-gray-600">
                    <InlineInput value={monthDream} onChange={setMonthDream} placeholder="南の島でのんびり" className="flex-1"/>
                    <span>します！</span>
                  </div>
                </div>
                <div>
                  <div className="text-[11px] text-rose-400 mb-1.5 flex items-center gap-1.5">
                    <span className="text-pink-300 text-[8px]">◆</span>
                    <span style={{letterSpacing:"0.05em"}}>姫は1年休みがあったら</span>
                  </div>
                  <div className="flex flex-wrap items-baseline gap-2 text-[12px] text-gray-600">
                    <InlineInput value={yearDream} onChange={setYearDream} placeholder="世界一周旅行" className="flex-1"/>
                    <span>しちゃいます ♥</span>
                  </div>
                </div>
                <div>
                  <div className="text-[11px] text-rose-400 mb-1.5 flex items-center gap-1.5">
                    <span className="text-pink-300 text-[8px]">◆</span>
                    <span style={{letterSpacing:"0.05em"}}>姫は10億円あったら</span>
                  </div>
                  <div className="flex flex-wrap items-baseline gap-2 text-[12px] text-gray-600">
                    <InlineInput value={richDream} onChange={setRichDream} placeholder="大きなお家と素敵な庭" className="flex-1"/>
                    <span>しちゃいます ♥</span>
                  </div>
                </div>
              </div>
              <div className="mt-4">
                <ButlerCard message="とっても素敵ですね！イメージしたことは現実になりますからね ♥"/>
              </div>
            </SectionCard>
          </section>

          {/* ③ プリンセスデイリー */}
          <section className="px-5 mt-7">
            <SectionTitle icon={<Crown className="w-4 h-4 text-pink-400"/>}>プリンセスデイリー</SectionTitle>
            <SectionCard>
              <div className="text-[11px] text-rose-500 text-center mb-4"
                style={{lineHeight:1.9, fontFamily:'"Shippori Mincho",serif'}}>
                姫はいつも心がタプタプに満たされています ♥<br/>
                だから、周りの人にも優しくいられるのです。<br/>
                姫の優雅な心喜ぶ1日はこちらです
              </div>
              <div className="grid grid-cols-3 gap-2">
                <HimeHabitCard title="朝の姫習慣" emoji="🌅" accent="from-rose-100/70 to-pink-50/70"
                  value={morning} onChange={setMorning} placeholder="白湯を飲む / 深呼吸 / お気に入りの香り"/>
                <HimeHabitCard title="昼の姫習慣" emoji="☀️" accent="from-pink-100/70 to-rose-50/70"
                  value={noon} onChange={setNoon} placeholder="お散歩 / お茶の時間 / 5分ストレッチ"/>
                <HimeHabitCard title="夜の姫習慣" emoji="🌙" accent="from-purple-100/70 to-pink-50/70"
                  value={night} onChange={setNight} placeholder="ハーブティー / 読書 / ゆっくり入浴"/>
              </div>
              <div className="mt-4 pt-3 border-t border-pink-100 text-[11px] text-rose-500 text-center"
                style={{lineHeight:1.9, fontFamily:'"Shippori Mincho",serif'}}>
                すごくいいですね ♥<br/>
                365日、姫を大切にするほどうまくいきますね
              </div>
            </SectionCard>
          </section>
        </div>
      );
    };

    /* =================================================
     *  BOTTOM NAV
     * ================================================= */
    const BottomNav = ({activeTab,setActiveTab}) => {
      const tabs = [
        {key:"home",label:"ホーム",Icon:HomeIcon},
        {key:"record",label:"記録",Icon:BookOpen},
        {key:"ideal",label:"理想",Icon:Star},
        {key:"daily",label:"デイリー",Icon:Sparkles},
        {key:"reflection",label:"振り返り",Icon:Heart},
      ];
      return (
        <div className="fixed bottom-0 left-1/2 w-full max-w-md px-4 pb-4 z-40" style={{transform:"translateX(-50%)"}}>
          <div className="relative bg-white/55 rounded-full border border-white/80 px-2 py-2 flex justify-around overflow-hidden"
            style={{backdropFilter:"blur(16px)", boxShadow:"0 8px 24px rgba(249,168,212,0.22)"}}>
            <div className="absolute inset-0 rounded-full" style={{background:"linear-gradient(90deg,rgba(253,242,248,0.4),rgba(255,255,255,0.3),rgba(250,245,255,0.4))"}}/>
            {tabs.map(t=>{
              const active = activeTab===t.key;
              const I = t.Icon;
              return (
                <button key={t.key} onClick={()=>setActiveTab(t.key)}
                  className="relative flex-1 flex flex-col items-center justify-center py-1.5 rounded-full transition-all duration-300 active:scale-95">
                  {active && <span className="absolute inset-0 rounded-full bg-gradient-to-b from-pink-100/80 to-rose-100/80" style={{boxShadow:"inset 0 0 10px rgba(249,168,212,0.3)"}}/>}
                  {active && <span className="absolute -top-1 w-10 h-10 bg-pink-300/40 rounded-full" style={{filter:"blur(12px)"}}/>}
                  <I className={`relative w-4 h-4 ${active?"text-rose-500":"text-pink-300"}`} stroke={active?2.5:2}/>
                  <span className={`relative text-[10px] mt-0.5 ${active?"text-rose-500 font-medium":"text-gray-400"}`} style={{letterSpacing:"0.1em"}}>{t.label}</span>
                </button>
              );
            })}
          </div>
        </div>
      );
    };

    /* =================================================
     *  ROOT
     * ================================================= */
    function App(){
      const [activeTab,setActiveTab] = useState("home");
      const [selectedMood,setSelectedMood] = useState("ごきげん");
      const [analysisType,setAnalysisType] = useState(null);
      const [loading,setLoading] = useState(false);
      const [screenKey,setScreenKey] = useState(0);

      const handleTabChange = (tab) => {
        if(tab===activeTab) return;
        setLoading(true);
        setTimeout(()=>{
          setActiveTab(tab);
          setScreenKey(k=>k+1);
          setLoading(false);
        }, 450);
      };
      const handleOpenAnalysis = (type) => {
        setLoading(true);
        setTimeout(()=>{
          setLoading(false);
          setAnalysisType(type);
        }, 700);
      };

      return (
        <div className="min-h-screen relative">
          <FixedBackground/>
          <div className="relative z-10 max-w-md mx-auto min-h-screen">
            <div key={screenKey}>
              {activeTab==="home" && <HomeScreen selectedMood={selectedMood} setSelectedMood={setSelectedMood} openAnalysis={handleOpenAnalysis}/>}
              {activeTab==="record" && <RecordScreen/>}
              {activeTab==="ideal" && <IdealScreen/>}
              {activeTab==="daily" && <PrincessDailyScreen/>}
              {activeTab==="reflection" && <ReflectionScreen/>}
            </div>
            <BottomNav activeTab={activeTab} setActiveTab={handleTabChange}/>
            <AnalysisModal type={analysisType} onClose={()=>setAnalysisType(null)}/>
            <SparkleLoader visible={loading}/>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App/>);
  </script>
  <script src="./twemoji.min.js"></script>
  <script>
    // TWEMOJI_START
    function applyTwemoji(){
      if(!window.twemoji) return;
      twemoji.parse(document.body, {
        callback: function(icon){ return './twemoji/' + icon + '.svg'; },
        className: 'twemoji-img'
      });
    }
    setTimeout(applyTwemoji, 300);
    setInterval(applyTwemoji, 800);
    // TWEMOJI_END
  </script>
  <style>
    img.twemoji-img { height: 1em; width: 1em; display: inline-block; vertical-align: -0.15em; margin: 0 0.02em; }
  </style>
</body>
</html>
